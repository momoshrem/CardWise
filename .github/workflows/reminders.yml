name: CardWise reminders
on:
  schedule:
    - cron: '7,22,37,52 * * * *'  # about every 15 minutes (GitHub often runs late or skips); an early run waits for the reminder time
    - cron: '23 15 1 * *'   # once a month: saves a tiny file so GitHub never pauses this job
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification now'
        type: boolean
        default: true
permissions:
  contents: write
  actions: write   # lets a waiting run start a fresh run of this workflow
jobs:
  send:
    if: github.event.schedule != '23 15 1 * *'
    # one reminder run at a time (a newer one waits its turn); a test notification never waits behind it
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.test && 'cardwise-test' || 'cardwise-reminders' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - run: node .github/reminders.js
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_PUBLIC: BHYchbU0ysf5oI_1LBZiLlB8EtRfV04ON0An4yzGxtUQ3YUizrHL0iUftzIv3U7m8lAUy5Kfdtpxdo5YtQFkjWg
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
  keepalive:
    if: github.event.schedule == '23 15 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%d > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "Keep CardWise reminders running" && git push
