<style>
:root{--bg:#0e1e24;--p1:#12242c;--p2:#172a32;--line:#1f2937;--mut:#6b7280;--sub:#9ca3af;--g:#00c805}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{min-height:100vh;max-width:380px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button,input{font:inherit}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:500;margin-bottom:6px}
.tot{display:flex;align-items:baseline;gap:4px;color:#fff}.tot i{font-style:normal;font-size:20px;color:var(--sub)}.tot b{font-size:38px;font-weight:500;letter-spacing:-.02em}
.pill{display:flex;align-items:center;gap:6px;background:var(--p2);border:.5px solid var(--line);border-radius:999px;padding:4px 10px;margin-top:4px;color:var(--sub);font-size:11px;font-family:ui-monospace,Menlo,monospace;cursor:pointer}
.pill s{width:8px;height:8px;border-radius:50%;background:var(--g)}.pill.w s{background:#ffb700}.pill.e s{background:#ff5000}
#count{font-size:13px;color:var(--sub);font-weight:500;margin-bottom:12px}
.card{aspect-ratio:1.586;border-radius:16px;padding:14px 16px;position:relative;border-top:.5px solid rgba(255,255,255,.2);transition:transform .15s}
#stack{container-type:inline-size}#stack .card+.card{margin-top:calc(50px - 63.05cqw)}
.card .nm{font-size:15px;font-weight:500}.card.ph .nm,.card.ph .num{text-shadow:0 1px 3px rgba(0,0,0,.6)}
.card .bt{position:absolute;left:16px;bottom:16px}
.chip{width:34px;height:26px;border-radius:5px;background:currentColor;opacity:.35;margin-bottom:12px}
.num{font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:.14em}
.card.lift{transition:none;z-index:5;outline:1.5px solid var(--g);scale:1.03}
.card.big{margin:0 auto 18px;max-width:360px}
.empty{color:var(--mut);font-size:14px;padding:40px 0;text-align:center}
#fab{position:fixed;right:24px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:40;width:56px;height:56px;border:0;border-radius:50%;background:var(--g);color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.4);cursor:pointer}
#fab:active{transform:scale(.95)}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 16px 40px;visibility:hidden;opacity:0;transform:translateX(28px);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .22s,visibility 0s .3s}
.ov.on{visibility:visible;opacity:1;transform:none;transition-delay:0s}.ov>div{max-width:380px;margin:0 auto}
.sh{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;visibility:hidden;opacity:0;transition:opacity .22s,visibility 0s .3s}
.sh.on{visibility:visible;opacity:1;transition-delay:0s}.sh>div{transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}.sh.on>div{transform:none}
.sh>div{background:var(--p1);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));user-select:text;-webkit-user-select:text}
.sh h2{margin:0 0 14px;font-size:18px;font-weight:500;color:#fff}.sh p{font-size:13px;color:var(--sub);margin:0 0 12px;line-height:1.5}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.lk{background:none;border:0;color:var(--g);font-size:14px;font-weight:500;display:flex;align-items:center;gap:4px;padding:0;cursor:pointer}.lk.m{color:var(--sub)}
.panel{background:var(--p1);border:.5px solid var(--line);border-radius:16px;padding:6px 16px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:.5px solid var(--line)}.row:last-child{border:0}
.ic{width:36px;height:36px;border-radius:10px;background:var(--p2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rm{flex:1}.row .lab{font-size:12px;color:var(--mut);margin-bottom:2px}.row .val{font-size:16px;color:#fff;font-weight:500}.row .val.L{font-size:20px}
.rr{text-align:right;font-size:13px;color:#d1d5db}.rr .s{font-size:11px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--sub);margin:0 0 5px}
input{width:100%;background:var(--bg);border:.5px solid var(--line);border-radius:12px;padding:12px;color:#fff;font-size:16px;margin-bottom:12px;height:46px;min-width:0;display:block;text-align:left;-webkit-appearance:none;appearance:none}
input[type=file]{height:auto;padding:9px;font-size:14px;color:var(--sub)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw button.on{border-color:#fff}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:600;font-size:15px;cursor:pointer;background:var(--g);color:#000;margin-top:4px}
.btn.s{background:var(--p2);color:#e5e7eb}.btn.d{background:none;color:#ff5000}
.card.big.ph{padding:0;aspect-ratio:auto;border-top:0;width:fit-content}.card.big.ph img{max-width:100%;max-height:230px;width:auto;display:block;border-radius:16px}.card.big.ph .nm{position:absolute;left:16px;top:14px}
.eye{position:absolute;right:12px;top:10px;background:none;border:0;color:inherit;padding:4px;display:flex;cursor:pointer}
.rv{position:absolute;inset:0;border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}.rt{display:flex;justify-content:space-between;align-items:center}
.card.big.ph .rv .nm{position:static}.rn{font-size:17px;letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;gap:8px}.cp{background:none;border:0;color:inherit;opacity:.85;padding:4px;display:flex;cursor:pointer}.ex>div{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}.ex small{width:100%}.ex{display:flex;gap:28px;font-family:ui-monospace,Menlo,monospace;font-size:13px}.ex small{display:block;font-size:10px;opacity:.7}
  .ttl{font-size:15px;font-weight:500;color:#fff;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cap{font-size:12px;color:var(--mut);text-align:center;margin:-8px 0 14px}#cap:empty{display:none}
#sum{background:var(--p1);border:.5px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:16px}#sum:empty{display:none}
.sr{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:.5px solid var(--line)}.sr:last-child{border:0}.sr .ic{width:32px;height:32px;border-radius:9px}.sr b{display:block;font-size:14px;color:#fff;font-weight:500}.sr small{font-size:12px;color:var(--sub)}
#pin{z-index:70}.dots{display:flex;justify-content:center;gap:14px;margin:0 0 18px}.dots span{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--mut)}.dots span.f{background:var(--g);border-color:var(--g)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}.pad button{background:var(--p2);border:0;border-radius:12px;padding:12px 0;font-size:22px;color:#fff;cursor:pointer}.pad .gh{background:none;font-size:14px;color:var(--sub)}
#pf{display:none;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--sub)}#pf img{height:44px;border-radius:6px}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}input[type=date]::-webkit-datetime-edit{padding:0}.two>div{min-width:0}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.ov .panel{animation:up .38s .1s cubic-bezier(.2,.8,.2,1) both}.ov .card.big{animation:up .36s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;transition-delay:0s!important}}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--p1);border-top:.5px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
#tabs>div{display:flex;max-width:380px;margin:0 auto}.tb{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:2px 0}.tb.on{color:var(--g)}
#vCards:not([hidden]),#vPay:not([hidden]){animation:fadein .25s}@keyframes fadein{from{opacity:0}}
#pdetail{bottom:calc(56px + env(safe-area-inset-bottom));z-index:35;padding-bottom:30px}
.mnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.mnav span{font-size:15px;font-weight:500;color:#fff}.mb{background:none;border:0;color:var(--sub);padding:4px;display:flex;cursor:pointer}.mb:disabled{color:#374151;cursor:default}
.pbar{height:8px;border-radius:4px;background:var(--p2);overflow:hidden;margin:10px 0 8px}.pbar i{display:block;height:100%;width:0;background:var(--g);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bsub{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}.sec{font-size:13px;color:var(--sub);font-weight:500;margin:18px 0 10px}
.pr{display:flex;align-items:center;gap:12px;background:var(--p1);border:.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}.pr:active{transform:scale(.99)}
.pr .th{width:44px;height:28px;border-radius:5px;flex-shrink:0}.pr .pm{flex:1;min-width:0}.pr b{display:block;font-size:14px;color:#fff;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pr small{font-size:12px;color:var(--mut)}
.pr .pv{text-align:right;font-size:14px;color:#fff}.pr .pv small{display:block;font-size:11px;margin-top:2px}.ok{color:#00c805!important}.wn{color:#ffb700!important}
.hh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.hh .sec{margin:0}
.rng{display:flex;align-items:center;gap:4px;background:var(--p2);border:.5px solid var(--line);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:500;color:var(--g);cursor:pointer}
.chart{background:var(--p1);border:.5px solid var(--line);border-radius:16px;padding:14px 12px 10px;margin-bottom:8px;overflow-x:auto}.chart svg{display:block}
.lg{display:flex;gap:16px;font-size:12px;color:var(--sub);margin:0 0 6px}.lg span{display:flex;align-items:center;gap:6px}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mr{display:flex;align-items:center;padding:11px 0;border-bottom:.5px solid var(--line);cursor:pointer}.mr:last-child{border:0}.mr span{flex:1;font-size:14px;color:#fff}.mr em{font-style:normal;font-size:13px;color:var(--sub);margin-right:8px}.mr svg{color:#4b5563}
.thumb{height:90px;border-radius:14px;margin-bottom:16px;border-top:.5px solid rgba(255,255,255,.15)}
.pcard{background:var(--p1);border:.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:6px;animation:up .38s .1s cubic-bezier(.2,.8,.2,1) both}
.ph2{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--sub);font-weight:500}
.pst{display:flex;gap:12px}.pst>div{flex:1}.pst small{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}.pst b{font-size:20px;color:#fff;font-weight:500}.pss{font-size:12px}
#rmenu{position:fixed;z-index:80;width:168px;max-height:300px;overflow-y:auto;background:var(--p2);border:.5px solid #2a3a44;border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:fadein .15s}
.ri{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:9px;font-size:14px;color:#e5e7eb;cursor:pointer}.ri.on{background:var(--bg);color:var(--g);font-weight:500}
.chipb{display:inline-flex;align-items:center;gap:6px;background:var(--p2);border:.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--g);margin:0 0 16px;cursor:pointer}
select{width:100%;background:var(--bg);border:.5px solid var(--line);border-radius:12px;padding:12px;color:#fff;font-size:16px;margin-bottom:12px;height:46px;-webkit-appearance:none;appearance:none}
.drow{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:16px;color:#fff;min-height:46px}
.lg{flex-wrap:wrap;gap:6px 14px}.lg span{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{flex:1;min-width:0}.pl b{display:block;font-size:14px;color:#fff;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl small{font-size:12px;color:var(--mut)}.pa{font-size:14px;color:#fff}
.ptop{display:flex;align-items:center;gap:16px;margin-bottom:20px}.thb{width:132px;border-radius:10px;display:block;flex-shrink:0}
.pm1{font-size:12px;color:var(--mut);margin-bottom:2px}.pm2{font-size:28px;color:#fff;font-weight:500;letter-spacing:-.01em}.pm3{font-size:12px;color:var(--sub);margin-top:2px}.pm4{font-size:12px;color:var(--mut);margin-top:2px}
#pmlist{margin-bottom:6px}

.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 0;cursor:pointer;font-size:15px}.mh>span:first-child{font-weight:500;color:#fff}.mh .mt{display:flex;align-items:center;gap:6px;color:#fff}.mh svg{color:var(--mut);transition:transform .2s}
.mb2.open .mh{border-bottom:.5px solid var(--line)}.mb2.open .mh svg{transform:rotate(180deg)}
#plist{background:var(--p1);border:.5px solid var(--line);border-radius:16px;margin-bottom:18px;padding:0 14px}#plist .pr{background:none;border:0;border-bottom:.5px solid var(--line);border-radius:0;margin:0;padding:12px 0}#plist .pr:last-child{border-bottom:0}#plist .empty{padding:14px 0}.pr .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.mb2 .pr{background:none;border:0;border-bottom:.5px solid var(--line);border-radius:0;margin:0;padding:11px 0}.mb2 .pr:last-child{border-bottom:0}.mb2 .empty{padding:14px 0}
.cw{position:relative;background:var(--p1);border:.5px solid var(--line);border-radius:16px;padding:14px 0 12px 12px;margin-bottom:10px}
.cw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:28px;border-radius:16px 0 0 16px;background:linear-gradient(90deg,var(--p1),rgba(18,36,44,0));pointer-events:none;z-index:1}
.sc{overflow-x:auto;overflow-y:hidden;padding-right:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.sc::-webkit-scrollbar{display:none}
.cols{display:flex;width:max-content;height:150px;align-items:flex-end;border-bottom:.5px solid var(--line)}
.col{width:52px;height:150px;display:flex;flex-direction:column-reverse;align-items:center;cursor:pointer;border-radius:8px 8px 0 0}.col>div{width:30px;flex-shrink:0}.col.sel{background:var(--p2)}
.labs{display:flex;width:max-content;font-size:11px;color:var(--mut);padding-top:6px}.labs span{width:52px;text-align:center;white-space:nowrap}.labs .on{color:var(--g);font-weight:500}
.rd{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 12px;font-size:14px;color:#fff}.rd span:first-child{font-weight:500}.rd small{font-size:12px;color:var(--mut)}
.lgd{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12px;color:var(--sub);padding:0 2px}.lgd div{display:flex;align-items:center;gap:7px;min-width:0}.lgd i{width:10px;height:10px;border-radius:3px;flex-shrink:0}.lgd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[hidden]{display:none!important}
#pback{font-size:13px}
	.hr{display:flex;align-items:center;gap:10px}
.ib{background:var(--p2);border:.5px solid var(--line);border-radius:8px;color:var(--sub);width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}.ib:active{transform:scale(.94)}
.yl{font-size:13px;color:var(--sub);font-weight:500;margin:6px 0 8px}.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.mc{background:var(--p2);border:.5px solid var(--line);border-radius:12px;padding:10px 0;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.mc b{font-size:14px;font-weight:500}.mc small{font-size:11px;color:var(--mut)}
.mc.on{border-color:var(--g);background:var(--bg)}.mc.on b{color:var(--g)}.mc.off{visibility:hidden}
</style>
</head>
<body>
<div id="vCards">
<div class="top">
  <div><div class="lbl">Total credit limit</div><div class="tot"><i>$</i><b id="total">0</b></div></div>
  <div class="pill" id="pill"><s></s><span class="syncT">Synced</span></div>
</div>
<div id="sum"></div>
<div id="count"></div>
<div id="stack"></div>
</div>
<div id="vPay" hidden>
  <div class="top"><div><div class="lbl" id="ptl">Paid this month</div><div class="tot"><i>$</i><b id="ptotal">0.00</b></div><div class="bsub"><span id="pof"></span></div></div><div class="pill"><s></s><span class="syncT">Synced</span></div></div>
  <div class="hh"><span class="sec">By card</span><button class="lk" id="pback" hidden></button></div>
  <div id="plist"></div>
  <div class="hh"><span class="sec">History</span><span class="hr"><span class="bsub">All cards</span><button class="ib" id="pcal" aria-label="Pick a month"></button></span></div>
  <div class="cw" id="pchart"></div>
</div>
<button id="fab" aria-label="Add card"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 4v16m8-8H4"/></svg></button>
<div class="ov" id="detail"><div id="dbody"></div></div>
<div class="sh" id="sheet"><div id="sbody"></div></div>
<div class="sh" id="pin"><div id="pbody"></div></div>
<div class="ov" id="pdetail"><div id="pdbody"></div></div>
<nav id="tabs"><div><button class="tb on" data-t="cards"></button><button class="tb" data-t="pay"></button></div></nav>

<script>
const K={t:'cw_token',g:'cw_gist',c:'cw_cache'};
const $=s=>document.querySelector(s);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const lbl=c=>c.name||(c.last4?'Card ending '+c.last4:'Unnamed card');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const SOON=3,PASS='1203';
const COLORS=['#1b3a6e','#c9a24d','#1e7a3c','#f1f1ef','#8c2535','#2b2f36','#0f6e56','#4a2c7a'];
const svg=(p,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={limit:'<circle cx="12" cy="12" r="9"/><path d="M12 12l4-4"/>',stmt:'<path d="M14 3v4h4M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2zM9 13h6M9 17h6"/>',due:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/><circle cx="12" cy="16" r="1.5"/>',open:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16M9 16l2 2 4-4"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.4 5.5A9.8 9.8 0 0112 5c4.5 0 8 4 9 7a13 13 0 01-2.5 3.7M6.5 6.5C4.5 8 3 10 3 12c1 3 4.5 7 9 7 1.6 0 3-.5 4.2-1.2"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',check:'<path d="M5 12l5 5L20 7"/>',down:'<path d="M6 9l6 6 6-6"/>',right:'<path d="M9 6l6 6-6 6"/>',tcard:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h2"/>',cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',cal:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/>',back:'<path d="M15 18l-6-6 6-6"/>',edit:'<path d="M4 20h4L18.5 9.5a2.8 2.8 0 00-4-4L4 16v4zM13.5 6.5l4 4"/>'};
let cards=[],hasTx=false,pays=[];try{pays=normPays(JSON.parse(ls.get('cw_pcache')||'[]'))}catch(e){}
try{cards=JSON.parse(ls.get(K.c)||'[]')}catch(e){}

/* ---------- GitHub gist sync ---------- */
const gh=(path,o={})=>fetch('https://api.github.com'+path,Object.assign({},o,{headers:{Authorization:'Bearer '+ls.get(K.t),Accept:'application/vnd.github+json','Content-Type':'application/json'}}));
function setSync(t,s){document.querySelectorAll('.syncT').forEach(x=>x.textContent=t);document.querySelectorAll('.pill').forEach(x=>x.className='pill'+(s||''))}
async function load(){
  if(!ls.get(K.t)||!ls.get(K.g))return;
  setSync('Syncing',' w');
  try{
    const r=await gh('/gists/'+ls.get(K.g));if(!r.ok)throw 0;
    const j=await r.json(),f=j.files['cards.json'];hasTx=!!j.files['transactions.json'];
    let txt=f?f.content:'';if(f&&f.truncated)txt=await(await fetch(f.raw_url)).text();
    cards=txt?(JSON.parse(txt).cards||[]):[];ls.set(K.c,JSON.stringify(cards));
    const pf=j.files['payments.json'];let pt=pf?pf.content:'';if(pf&&pf.truncated)pt=await(await fetch(pf.raw_url)).text();
    pays=normPays(pt?JSON.parse(pt).payments:null);ls.set('cw_pcache',JSON.stringify(pays));
    setSync('Synced');render();refreshPay();
  }catch(e){setSync('Offline',' e')}
}
async function save(){
  ls.set(K.c,JSON.stringify(cards));setSync('Saving',' w');
  const files={'cards.json':{content:JSON.stringify({version:1,cards})}};
  if(!hasTx)files['transactions.json']={content:'[]'};
  try{const r=await gh('/gists/'+ls.get(K.g),{method:'PATCH',body:JSON.stringify({files})});if(!r.ok)throw 0;hasTx=true;setSync('Synced')}
  catch(e){setSync('Not saved',' e')}
}

/* ---------- helpers ---------- */
const light=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))>150};
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const today=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
function nxt(day){const t=today();for(let o=0;o<2;o++){const dim=new Date(t.getFullYear(),t.getMonth()+o+1,0).getDate();const d=new Date(t.getFullYear(),t.getMonth()+o,Math.min(day,dim));if(d>=t)return d}}
function inDays(d){const n=Math.round((d-today())/864e5);return n===0?'today':n===1?'tomorrow':'in '+n+' days'}
const short=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
function pd(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function age(s){const o=pd(s),n=new Date();let m=(n.getFullYear()-o.getFullYear())*12+n.getMonth()-o.getMonth()-(n.getDate()<o.getDate()?1:0);if(m<1)return'New';const y=Math.floor(m/12);return(y?y+' yr ':'')+(m%12)+' mo'}
function shrink(file){return new Promise(res=>{const im=new Image();im.onload=()=>{const w=Math.min(800,im.width),h=im.height*w/im.width,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',.8));URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(file)})}

/* ---------- render ---------- */
function cardEl(c,big){
  const el=document.createElement('div');el.className='card'+(c.photo?' ph':'')+(big?' big':'');el.dataset.id=c.id;
  el.style.color=c.photo?'#fff':(light(c.color)?'#2c2c2a':'#f1f5f9');
  const nm=c.photo?'':`<span class="nm">${esc(c.name)}</span>`,bt=c.last4&&!c.photo?`<div class="bt"><div class="chip"></div><div class="num">•••• •••• •••• ${esc(c.last4)}</div></div>`:'';
  if(c.photo&&big)el.innerHTML=`<img src="${c.photo}" alt="">`;
  else{el.style.background=c.photo?`center/cover url(${c.photo})`:c.color;el.innerHTML=nm+bt}
  return el;
}
/* upcoming statements and due dates, grouped by date */
function summary(){
  const g={};
  cards.forEach(c=>[['s',c.stmtDay],['d',c.dueDay]].forEach(([t,day])=>{
    if(!+day)return;const d=nxt(+day),n=Math.round((d-today())/864e5);
    if(n<=SOON)(g[t+d.getTime()]=g[t+d.getTime()]||{t,d,n,names:[]}).names.push(lbl(c));
  }));
  $('#sum').innerHTML=Object.values(g).sort((a,b)=>a.n-b.n).map(x=>{
    const w=x.n===0?'today':x.n===1?'tomorrow':'in '+x.n+' days',m=x.names.length>1;
    const h=x.t==='s'?(m?'Statements close ':'Statement closes ')+w:(m?'Payments due ':'Payment due ')+w;
    return `<div class="sr"><div class="ic" style="color:${x.t==='s'?'#0094ff':'#ffb700'}">${svg(IC[x.t==='s'?'stmt':'due'])}</div><div><b>${h}</b><small>${esc(x.names.join(', '))} on ${short(x.d)}</small></div></div>`}).join('');
}
function render(){
  summary();
  $('#total').textContent=cards.reduce((s,c)=>s+(+c.limit||0),0).toLocaleString('en-US');
  $('#count').textContent=cards.length===1?'1 card':cards.length+' cards';
  const st=$('#stack');st.innerHTML='';
  if(!cards.length){st.innerHTML='<div class="empty">Tap + to add your first card.</div>';return}
  cards.forEach(c=>st.appendChild(cardEl(c)));
}

/* ---------- press, drag to reorder, tap to open ---------- */
let P=null;const STEP=50,st=$('#stack');
st.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.card');if(!el)return;
  P={el,x:e.clientX,y:e.clientY,drag:false,start:[...st.children].indexOf(el)};P.idx=P.start;
  P.t=setTimeout(()=>{if(!P)return;P.drag=true;el.classList.add('lift');navigator.vibrate&&navigator.vibrate(10);try{el.setPointerCapture(e.pointerId)}catch(_){}},450);
});
addEventListener('pointermove',e=>{
  if(!P)return;const dx=e.clientX-P.x,dy=e.clientY-P.y;
  if(!P.drag){if(Math.abs(dx)>8||Math.abs(dy)>8){clearTimeout(P.t);P=null}return}
  const kids=[...st.children],n=kids.length,tgt=Math.max(0,Math.min(n-1,P.start+Math.round(dy/STEP)));
  if(tgt!==P.idx){const others=kids.filter(k=>k!==P.el);st.insertBefore(P.el,others[tgt]||null);P.idx=tgt}
  P.el.style.transform=`translateY(${dy-(P.idx-P.start)*STEP}px)`;
});
addEventListener('touchmove',e=>{if(P&&P.drag)e.preventDefault()},{passive:false});
function endPress(e){
  if(!P)return;clearTimeout(P.t);const p=P;P=null;
  if(p.drag){p.el.classList.remove('lift');p.el.style.transform='';
    if(e.type==='pointerup'){const ids=[...st.children].map(k=>k.dataset.id);cards=ids.map(id=>cards.find(c=>c.id===id));save()}
    render();
  }else if(e.type==='pointerup')openDetail(p.el.dataset.id);
}
addEventListener('pointerup',endPress);addEventListener('pointercancel',endPress);
addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- detail ---------- */
let rtm;
function hideNow(){clearTimeout(rtm);const r=$('#detail .rv');if(r)r.remove();const k=$('#cap');if(k)k.textContent=''}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hideNow()});
function askPin(ok){
  let v='';const b=$('#pbody');
  const draw=m=>{b.innerHTML=`<h2 style="text-align:center">Enter passcode</h2><p style="text-align:center">${m||'To view full number, expiration and CVV'}</p><div class="dots">${[0,1,2,3].map(i=>`<span class="${i<v.length?'f':''}"></span>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'x',0,'<'].map(k=>k==='x'?'<button class="gh" data-k="x">Cancel</button>':k==='<'?'<button class="gh" data-k="<">Delete</button>':`<button data-k="${k}">${k}</button>`).join('')}</div>`;
    b.querySelectorAll('button').forEach(x=>x.onclick=()=>{const k=x.dataset.k;
      if(k==='x'){$('#pin').classList.remove('on');return}
      if(k==='<'){v=v.slice(0,-1);draw();return}
      if(v.length<4)v+=k;
      if(v.length<4)return draw();
      if(v===PASS){$('#pin').classList.remove('on');ok()}else{v='';draw('Wrong passcode. Try again.')}})};
  draw();$('#pin').classList.add('on');
}
async function copyText(v,b){
  try{await navigator.clipboard.writeText(v)}catch(e){const t=document.createElement('textarea');t.value=v;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();t.setSelectionRange(0,99);document.execCommand('copy');t.remove()}
  const o=b.innerHTML;b.innerHTML=svg(IC.check);setTimeout(()=>{b.innerHTML=o},1500);
}
function reveal(c,el){
  hideNow();const n=(c.num||'').replace(/\D/g,''),g=n.length===15?[4,6,5]:[4,4,4,4];let i=0;
  const num=n?g.map(x=>{const t=n.slice(i,i+x);i+=x;return t}).filter(Boolean).join(' '):'No number saved';
  const rv=document.createElement('div');rv.className='rv';rv.style.background=c.photo?'rgba(0,0,0,.82)':c.color;
  const cp=v=>v?`<button class="cp" data-v="${esc(v)}" aria-label="Copy">${svg(IC.copy)}</button>`:'';
  rv.innerHTML=`<div class="rt"><span class="nm">${esc(c.name)}</span><button class="eye" style="position:static">${svg(IC.eyeoff)}</button></div><div><div class="num rn"><span>${esc(num)}</span>${cp(n)}</div><div class="ex"><div><small>EXP</small><span>${esc(c.exp||'--')}</span>${cp(c.exp)}</div><div><small>CVV</small><span>${esc(c.cvv||'--')}</span>${cp(c.cvv)}</div></div></div>`;
  rv.querySelectorAll('.cp').forEach(b=>b.onclick=()=>copyText(b.dataset.v,b));
  rv.querySelector('.eye').onclick=hideNow;el.appendChild(rv);
  $('#cap').textContent='Hides again in 30 seconds';rtm=setTimeout(hideNow,30000);
}
function openDetail(id){
  const c=cards.find(x=>x.id===id);if(!c)return;
  const row=(i,col,lab,val,a,b,L)=>`<div class="row"><div class="ic" style="color:${col}">${svg(IC[i])}</div><div class="rm"><div class="lab">${lab}</div><div class="val${L?' L':''}">${val}</div></div>${a?`<div class="rr"><div>${a}</div><div class="s">${b}</div></div>`:''}</div>`;
  const s=+c.stmtDay,d=+c.dueDay;
  $('#dbody').innerHTML=`<div class="nav"><button class="lk" id="bk">${svg(IC.back)}Cards</button><div class="ttl">${esc(c.name)}</div><button class="lk m" id="ed">${svg(IC.edit)}Edit</button></div>`+
  `<div id="big"></div><div id="cap"></div><div class="panel">`+
  row('limit','#00c805','Credit limit','$'+(+c.limit||0).toLocaleString('en-US'),'','',1)+
  row('stmt','#0094ff','Statement prints',s?ord(s)+' of each month':'Not set',s?short(nxt(s)):'',s?inDays(nxt(s)):'')+
  row('due','#ffb700','Payment due',d?ord(d)+' of each month':'Not set',d?short(nxt(d)):'',d?inDays(nxt(d)):'')+
  row('open','#9d4edd','Date opened',c.opened?pd(c.opened).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'Not set',c.opened?age(c.opened):'',c.opened?'card age':'')+`</div>`;
  const el=cardEl(c,true);$('#big').replaceWith(el);
  if(c.num||c.exp||c.cvv){const b=document.createElement('button');b.className='eye';b.innerHTML=svg(IC.eye);b.onclick=()=>askPin(()=>reveal(c,el));el.appendChild(b)}
  $('#bk').onclick=()=>{hideNow();$('#detail').classList.remove('on')};
  $('#ed').onclick=()=>{hideNow();openForm(c)};
  $('#detail').classList.add('on');$('#detail').scrollTop=0;
}

/* ---------- add / edit form ---------- */
function openForm(c){
  const e=c||{color:COLORS[0]};let col=e.color,photo=e.photo||'',clr=false;const has=!!(e.num||e.exp||e.cvv);
  const hid=has?'Hidden. Leave blank to keep':'';
  $('#sbody').innerHTML=`<h2>${c?'Edit card':'Add card'}</h2>
  <label>Card name</label><input id="fn" value="${esc(e.name)}" placeholder="Chase Sapphire">
  <label>Credit limit ($)</label><input id="fl" type="number" inputmode="decimal" value="${esc(e.limit)}" placeholder="15000">
  <div class="two"><div><label>Statement prints (day 1-31)</label><input id="fs" type="number" inputmode="numeric" min="1" max="31" value="${esc(e.stmtDay)}"></div>
  <div><label>Payment due (day 1-31)</label><input id="fd" type="number" inputmode="numeric" min="1" max="31" value="${esc(e.dueDay)}"></div></div>
  <div class="two"><div><label>Date opened</label><input id="fo" type="date" value="${esc(e.opened)}"></div>
  <div><label>Last 4 digits</label><input id="f4" inputmode="numeric" maxlength="4" value="${esc(e.last4)}"></div></div>
  <label>Full card number (optional)</label><input id="fu" inputmode="numeric" placeholder="${hid||'1234 5678 9012 3456'}">
  <div class="two"><div><label>Expiration (MM/YY)</label><input id="fx" placeholder="${hid||'09/28'}" maxlength="5"></div>
  <div><label>CVV</label><input id="fv" inputmode="numeric" maxlength="4" placeholder="${has?'Hidden':''}"></div></div>
  ${has?'<button class="btn s" id="fc" type="button">Remove saved number, expiration and CVV</button><div style="height:12px"></div>':''}
  <label>Card color</label><div class="sw">${COLORS.map(x=>`<button type="button" data-c="${x}" style="background:${x}" class="${x===col?'on':''}"></button>`).join('')}</div>
  <label>Card photo (optional)</label><div id="pf"></div><input id="fp" type="file" accept="image/*">
  <button class="btn" id="sv">Save card</button><button class="btn s" id="cn">Cancel</button>${c?'<button class="btn d" id="dl">Delete card</button>':''}`;
  const drawP=()=>{const p=$('#pf');p.style.display=photo?'flex':'none';p.innerHTML=photo?`<img src="${photo}" alt=""><span style="flex:1">Photo added</span><button class="lk m" id="rp" type="button">Remove photo</button>`:'';if(photo)$('#rp').onclick=()=>{photo='';$('#fp').value='';drawP()}};
  drawP();
  $('#sbody').querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{col=b.dataset.c;$('#sbody').querySelectorAll('.sw button').forEach(x=>x.classList.toggle('on',x===b))});
  $('#fp').onchange=async ev=>{if(ev.target.files[0]){photo=await shrink(ev.target.files[0]);drawP()}};
  if(has)$('#fc').onclick=()=>{clr=true;$('#fc').textContent='Will be removed when you save'};
  $('#cn').onclick=closeSheet;
  $('#sv').onclick=()=>{
    const name=$('#fn').value.trim(),lim=$('#fl').value;if(lim===''){$('#fl').focus();return}
    const clamp=v=>v?Math.max(1,Math.min(31,+v)):'';
    const num=clr?'':($('#fu').value.replace(/\D/g,'')||e.num||''),exp=clr?'':($('#fx').value.trim()||e.exp||''),cvv=clr?'':($('#fv').value.replace(/\D/g,'')||e.cvv||'');
    const o={id:e.id||'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,limit:+lim,stmtDay:clamp($('#fs').value),dueDay:clamp($('#fd').value),opened:$('#fo').value,last4:num?num.slice(-4):$('#f4').value.replace(/\D/g,'').slice(0,4),num,exp,cvv,color:col,photo};
    c?cards[cards.findIndex(x=>x.id===c.id)]=o:cards.push(o);
    closeSheet();render();save();if(c)openDetail(o.id);
  };
  if(c)$('#dl').onclick=()=>{if(confirm('Delete '+(c.name||'this card')+'?')){cards=cards.filter(x=>x.id!==c.id);closeSheet();$('#detail').classList.remove('on');render();save()}};
  $('#sheet').classList.add('on');
}
const closeSheet=()=>$('#sheet').classList.remove('on');

/* ---------- connect to GitHub ---------- */
function openSetup(){
  $('#sbody').innerHTML=`<h2>Connect to GitHub</h2><p>Use a GitHub token with the gist permission. Cards are stored in their own private gist, separate from your expense app.</p>
  <label>GitHub token</label><input id="st" type="password" value="${esc(ls.get(K.t))}" placeholder="ghp_...">
  <label>Gist ID</label><input id="sg" value="${esc(ls.get(K.g))}" placeholder="Paste your gist ID">
  <button class="btn" id="sc">Connect</button><button class="btn s" id="sx">Close</button>`;
  const keep=()=>{ls.set(K.t,$('#st').value.trim());ls.set(K.g,$('#sg').value.trim())};
  $('#sc').onclick=()=>{keep();closeSheet();load()};
  $('#sx').onclick=closeSheet;
  $('#sheet').classList.add('on');
}

/* ---------- payments: a simple log of dated payments ---------- */
const nf=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),mf=n=>'$'+nf(n);
const mk=(y,m)=>y+'-'+String(m+1).padStart(2,'0'),pk=k=>k.split('-').map(Number);
const mLong=(y,m)=>new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}),mAbbr=m=>new Date(2000,m,1).toLocaleDateString('en-US',{month:'short'});
const tstr=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dShort=s=>pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric'}),dFull=s=>pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const N0=new Date(),CUR={y:N0.getFullYear(),m:N0.getMonth()},CK=mk(CUR.y,CUR.m);
let curPay=null,selA=CK,selC={};
const PAL=['#2f6fe0','#9d4edd','#2fb457','#d9d9d6','#ffb700','#ff5000','#0094ff','#e056a0'];
function normPays(r){
  if(Array.isArray(r))return r.filter(p=>p&&p.card&&p.date);
  const out=[];
  if(r&&typeof r==='object')Object.keys(r).forEach(k=>Object.keys(r[k]||{}).forEach(id=>{const a=+r[k][id].p;if(a>0)out.push({id:'m'+k+id,card:id,amt:a,date:k+'-01'})}));
  return out;
}
const live=()=>pays.filter(p=>cards.some(c=>c.id===p.card)),inM=(p,k)=>p.date.slice(0,7)===k,sum=a=>a.reduce((t,p)=>t+(+p.amt||0),0);
const byDate=(a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1);
const cCol=id=>PAL[Math.max(0,cards.findIndex(c=>c.id===id))%PAL.length];
const thumbBg=c=>c.photo?`center/cover url(${c.photo})`:c.color;
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
/* every month from the first payment up to now (at least 6 so the chart never looks empty) */
function allKeys(list){
  const e=list.map(p=>p.date.slice(0,7)).sort()[0];let n=6;
  if(e){const[ey,em]=pk(e);n=Math.max(6,(CUR.y-ey)*12+CUR.m-(em-1)+1)}
  const out=[];for(let i=n-1;i>=0;i--){const d=new Date(CUR.y,CUR.m-i,1);out.push(mk(d.getFullYear(),d.getMonth()))}
  return out;
}
/* sideways-scrolling bar chart; segF(monthKey) -> [{c:color,v:amount}] stacked bottom to top */
function drawChart(host,keys,segF,sel){
  const old=host.querySelector('.sc'),left=old&&old.scrollWidth>0?old.scrollLeft:null;
  const vals=keys.map(segF),tots=vals.map(a=>a.reduce((t,x)=>t+x.v,0)),mx=Math.max(1,...tots);
  const cols=vals.map((segs,i)=>{const on=segs.filter(x=>x.v>0);
    return `<div class="col${keys[i]===sel?' sel':''}" data-k="${keys[i]}">${on.map((x,j)=>`<div style="height:${Math.max(1.5,x.v/mx*130)}px;background:${x.c}${j===on.length-1?';border-radius:3px 3px 0 0':''}"></div>`).join('')}</div>`}).join('');
  const labs=keys.map((k,i)=>{const[yr,mo]=pk(k);return `<span class="${k===sel?'on':''}">${mAbbr(mo-1)+(mo===1||i===0?' ’'+String(yr).slice(2):'')}</span>`}).join('');
  host.innerHTML=`<div class="sc"><div class="cols">${cols}</div><div class="labs">${labs}</div></div>`;
  const n=host.querySelector('.sc');n.scrollLeft=left==null?n.scrollWidth:left;
}
function centerSel(host){
  const n=host.querySelector('.sc'),c=host.querySelector('.col.sel');if(!n||!c)return;
  const x=c.getBoundingClientRect().left-n.getBoundingClientRect().left+n.scrollLeft-n.clientWidth/2+26;
  n.scrollTo({left:Math.max(0,x),behavior:'smooth'});
}
/* calendar: every month from the first payment to now */
function openMonthPicker(list,sel,onPick){
  const keys=allKeys(list),tot={};list.forEach(p=>{const k=p.date.slice(0,7);tot[k]=(tot[k]||0)+(+p.amt||0)});
  const y0=pk(keys[0])[0];let h='<h2>Jump to a month</h2>';
  for(let y=CUR.y;y>=y0;y--){h+=`<div class="yl">${y}</div><div class="mg">`;
    for(let m=0;m<12;m++){const k=mk(y,m);
      h+=keys.includes(k)?`<button class="mc${k===sel?' on':''}" data-k="${k}"><b>${mAbbr(m)}</b><small>${tot[k]?'$'+Math.round(tot[k]).toLocaleString('en-US'):'—'}</small></button>`:'<span class="mc off"></span>'}
    h+='</div>'}
  h+='<button class="btn s" id="mcx">Close</button>';
  $('#sbody').innerHTML=h;
  $('#sbody').querySelectorAll('button.mc').forEach(b=>b.onclick=()=>{closeSheet();onPick(b.dataset.k)});
  $('#mcx').onclick=closeSheet;$('#sheet').classList.add('on');
}
function refreshPay(){
  const L=live(),keys=allKeys(L);if(!keys.includes(selA))selA=CK;
  const[sy,sm]=pk(selA),mp=L.filter(p=>inM(p,selA)),nc=new Set(mp.map(p=>p.card)).size,isNow=selA===CK;
  $('#ptl').textContent='Paid in '+new Date(sy,sm-1,1).toLocaleDateString('en-US',sy===CUR.y?{month:'long'}:{month:'long',year:'numeric'});
  $('#ptotal').textContent=nf(sum(mp));
  $('#pof').textContent=mp.length?plural(mp.length,'payment')+' across '+plural(nc,'card'):(isNow?'No payments this month':'No payments that month');
  const pb=$('#pback');pb.hidden=isNow;pb.textContent='Back to '+new Date(CUR.y,CUR.m,1).toLocaleDateString('en-US',{month:'long'});
  $('#plist').innerHTML=cards.length?cards.map(c=>{const b=mp.filter(p=>p.card===c.id).sort(byDate);
    return `<div class="pr" data-id="${esc(c.id)}"><i class="dot" style="background:${cCol(c.id)}"></i><div class="pm"><b>${esc(lbl(c))}</b><small>${b.length?'Last paid '+dShort(b[0].date):'No payments'}</small></div><div class="pv"${b.length?'':' style="color:var(--mut)"'}>${mf(sum(b))}</div></div>`}).join(''):'<div class="empty">Add a card first.</div>';
  /* chart across all cards, colored by card */
  drawChart($('#pchart'),keys,kk=>cards.map(c=>({c:cCol(c.id),v:sum(L.filter(p=>p.card===c.id&&inM(p,kk)))})),selA);
  if(curPay&&$('#pdetail').classList.contains('on'))openPayDetail(curPay);
}
const keysSel=id=>selC[id]||CK;
function drawCardChart(id){
  const all=live().filter(p=>p.card===id),keys=allKeys(all),sel=keys.includes(selC[id])?selC[id]:CK;
  drawChart($('#pchart2'),keys,kk=>[{c:cCol(id),v:sum(all.filter(p=>inM(p,kk)))}],sel);
  const a=all.filter(p=>inM(p,sel)).sort(byDate),[y,m]=pk(sel);
  $('#cm1').textContent=mLong(y,m-1);$('#cm2').textContent=mf(sum(a));
  $('#cm3').textContent=sel===CK?'Paid this month':'Paid that month';
  $('#cm4').textContent=a.length?'Last paid '+dShort(a[0].date):(sel===CK?'No payments this month':'No payments that month');
}
function openPayDetail(id){
  const c=cards.find(x=>x.id===id);if(!c)return;curPay=id;
  const all=live().filter(p=>p.card===id).sort(byDate);
  const thumb=c.photo?`<img class="thb" src="${c.photo}" alt="">`:`<div class="thb" style="background:${c.color};aspect-ratio:1.586"></div>`;
  $('#pdbody').innerHTML=`<div class="nav"><button class="lk" id="pdb">${svg(IC.back)}Payments</button><div class="ttl">${esc(lbl(c))}</div><div style="width:76px"></div></div>
  <div class="ptop">${thumb}<div><div class="pm1" id="cm1"></div><div class="pm2" id="cm2"></div><div class="pm3" id="cm3"></div><div class="pm4" id="cm4"></div></div></div>
  <div class="hh"><span class="sec">History</span><button class="ib" id="pcal2" aria-label="Pick a month">${svg(IC.cal,16)}</button></div>
  <div class="cw" id="pchart2"></div>
  <div class="sec" style="margin-top:6px">Payments</div>
  <div>${all.length?all.slice(0,60).map(p=>`<div class="mr" data-id="${esc(p.id)}"><div class="pl"><b>${mf(p.amt)}</b><small>${dFull(p.date)}</small></div>${svg(IC.right,16)}</div>`).join(''):'<div class="empty" style="padding:16px 0">No payments yet. Tap + to add one.</div>'}</div>`;
  $('#pdb').onclick=closePayDetail;
  $('#pcal2').onclick=()=>openMonthPicker(all,keysSel(id),k=>{selC[id]=k;drawCardChart(id);centerSel($('#pchart2'))});
  $('#pdbody').querySelectorAll('.mr').forEach(r=>r.onclick=()=>openPayForm(pays.find(p=>p.id===r.dataset.id)));
  $('#pchart2').onclick=e=>{const col=e.target.closest('.col');if(col){selC[id]=col.dataset.k;drawCardChart(id)}};
  drawCardChart(id);$('#pdetail').classList.add('on');
}
function closePayDetail(){curPay=null;$('#pdetail').classList.remove('on')}
function openPayForm(p,presel){
  if(!cards.length)return;
  const e=p||{card:presel||curPay||cards[0].id,amt:'',date:tstr()};
  $('#sbody').innerHTML=`<h2>${p?'Edit payment':'Add payment'}</h2>
  <label>Card</label><select id="pc">${cards.map(c=>`<option value="${esc(c.id)}"${c.id===e.card?' selected':''}>${esc(lbl(c))}</option>`).join('')}</select>
  <label>Amount paid ($)</label><input id="pa" type="number" inputmode="decimal" step="0.01" value="${e.amt}" placeholder="0.00">
  <label>Date paid</label><div class="drow" id="dr"><span>${e.date===tstr()?'Today, '+dShort(e.date):dFull(e.date)}</span><button type="button" class="lk" id="dc">Change</button></div><input id="pdt" type="date" value="${e.date}" max="${tstr()}" style="display:none">
  <button class="btn" id="psv">Save payment</button><button class="btn s" id="pcn">Cancel</button>${p?'<button class="btn d" id="pdl">Delete payment</button>':''}`;
  $('#dc').onclick=()=>{$('#dr').style.display='none';$('#pdt').style.display='block';$('#pdt').focus()};
  $('#pcn').onclick=closeSheet;
  $('#psv').onclick=()=>{const a=+$('#pa').value,d=$('#pdt').value||e.date;if(!(a>0)){$('#pa').focus();return}
    const o={id:e.id||'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),card:$('#pc').value,amt:Math.round(a*100)/100,date:d>tstr()?tstr():d};
    const i=p?pays.findIndex(x=>x.id===p.id):-1;if(i>=0)pays[i]=o;else pays.push(o);
    const k=o.date.slice(0,7);selA=k;selC[o.card]=k;
    closeSheet();savePays();refreshPay()};
  if(p)$('#pdl').onclick=()=>{pays=pays.filter(x=>x.id!==p.id);closeSheet();savePays();refreshPay()};
  $('#sheet').classList.add('on');
}
async function savePays(){
  ls.set('cw_pcache',JSON.stringify(pays));setSync('Saving',' w');
  try{const r=await gh('/gists/'+ls.get(K.g),{method:'PATCH',body:JSON.stringify({files:{'payments.json':{content:JSON.stringify({version:2,payments:pays})}}})});if(!r.ok)throw 0;setSync('Synced')}
  catch(e){setSync('Not saved',' e')}
}
function setTab(t){
  $('#vCards').hidden=t!=='cards';$('#vPay').hidden=t!=='pay';document.body.classList.toggle('ptab',t==='pay');
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  closePayDetail();if(t==='pay'){$('#pchart').innerHTML='';refreshPay()}scrollTo(0,0);
}
$('#pchart').onclick=e=>{const col=e.target.closest('.col');if(col){selA=col.dataset.k;refreshPay()}};
$('#plist').onclick=e=>{const r=e.target.closest('.pr');if(r){selC[r.dataset.id]=selA;openPayDetail(r.dataset.id)}};
$('#pcal').innerHTML=svg(IC.cal,16);
$('#pcal').onclick=()=>openMonthPicker(live(),selA,k=>{selA=k;refreshPay();centerSel($('#pchart'))});
$('#pback').onclick=()=>{selA=CK;refreshPay()};
const TB=document.querySelectorAll('.tb');TB[0].innerHTML=svg(IC.tcard,24)+'Cards';TB[1].innerHTML=svg(IC.cash,24)+'Payments';
TB.forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('#fab').onclick=()=>{if(!(ls.get(K.t)&&ls.get(K.g)))return openSetup();document.body.classList.contains('ptab')?openPayForm(null,curPay):openForm()};
document.querySelectorAll('.pill').forEach(p=>p.onclick=openSetup);
$('#sheet').addEventListener('pointerdown',e=>{if(e.target.id==='sheet')closeSheet()});
render();
if(ls.get(K.t)&&ls.get(K.g))load();else{setSync('Not connected',' e');openSetup()}
</script>
</body>
