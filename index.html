<style>
:root{--bg:#0e1e24;--p1:#12242c;--p2:#172a32;--line:#1f2937;--mut:#8a94a0;--sub:#9ca3af;--g:#00c805;--amb:#ffb700;--blue:#0094ff;--org:#ff5000;--gen:linear-gradient(145deg,#3b4046,#1b1e22);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button{color:inherit}

[hidden]{display:none!important}
.view:not([hidden]){animation:fadein .25s}
@keyframes fadein{from{opacity:0}}

/* ---------- header ---------- */
.top{display:flex;justify-content:space-between;margin-bottom:16px;align-items:center}

.empty{color:var(--mut);font-size:14px;padding:40px 0;text-align:center}

/* ---------- home + expenses panels ---------- */
.n-card{display:block;width:100%;text-align:left;background:var(--p1);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;color:inherit;cursor:pointer}
.n-card.still{cursor:default}
.n-row{display:flex;justify-content:space-between;align-items:center}
.n-big{display:flex;align-items:baseline;gap:4px;color:var(--tx);margin:6px 0 14px}.n-big i{font-style:normal;font-size:22px;color:var(--sub)}.n-big b{font-size:44px;font-weight:500;letter-spacing:-.02em}
.n-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--p2)}.n-bar i{display:block;height:100%}
.n-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12px;color:var(--sub)}.n-leg span{display:flex;align-items:center;gap:6px}.n-leg i{width:8px;height:8px;border-radius:50%;display:inline-block}

.n-tag{font-style:normal;font-weight:700;letter-spacing:.05em;font-size:.8em;flex-shrink:0}.n-tag.p{color:var(--amb)}.n-tag.s{color:var(--blue)}

.n-tile{text-align:left;background:var(--p1);border:1px solid var(--line);padding:14px;cursor:pointer;border-radius:22px}.n-tile small{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}.n-tile b{font-size:18px;color:var(--tx);font-weight:500}
.n-donut{position:relative;flex-shrink:0;width:112px;height:112px}.n-donut svg{display:block;transform:rotate(-90deg);width:100%;height:100%}
.n-dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.n-dc b{font-size:22px;color:var(--tx);font-weight:500}.n-dc small{font-size:11px;color:var(--sub)}
.n-mrow{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:44px;cursor:pointer;text-align:left;background:rgba(0,200,5,.07);border:1px solid rgba(0,200,5,.35);border-radius:22px;padding:14px 18px;margin-bottom:12px}
.n-mrow span:first-child{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;color:var(--tx2)}.n-mrow i{width:10px;height:10px;border-radius:50%;background:var(--g)}
.xr{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;padding:13px 0;min-height:52px}
.xr .xl{display:flex;align-items:flex-start;gap:12px;min-width:0;flex:1}.xr .xd{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0}

.xr .xt{min-width:0}
.xa{font:600 14px ui-monospace,Menlo,monospace;flex-shrink:0;font-weight:600;font-size:15px;line-height:1.2;font-family:inherit;color:var(--tx);background:none;border-radius:0;padding:0}
.xr.off{opacity:.5}.badge{font-size:9px;padding:2px 6px;border-radius:4px;background:var(--line);color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-left:8px;flex-shrink:0}
.xr .chev{color:var(--sub);transition:transform .2s;display:none}.xr .chev.up{transform:rotate(180deg)}
.xs{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);padding:0 0 14px 22px}
.si{display:flex;align-items:center;justify-content:space-between;background:var(--p0b);border-radius:10px;padding:6px 6px 6px 12px;font-size:14px;min-height:44px;gap:8px}.si span:first-child{color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si .r{display:flex;align-items:center;gap:2px;flex-shrink:0}.si .r span{color:var(--sub);font-family:inherit}
.si button{background:none;border:0;color:#f87171;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.xs .none{font-size:12px;color:var(--mut);font-style:italic;padding:4px 2px}
.sub-add{display:flex;gap:8px;padding-top:4px}
.sub-add input{margin:0;height:44px;min-width:0;padding:0 10px;font-size:14px;border-radius:10px;background:var(--p0b)}.sub-add .sn{flex:1}.sub-add .sa{width:78px;flex:none;font-family:inherit}
.sub-add button{height:44px;padding:0 14px;border:0;border-radius:10px;background:var(--g);color:#000;font-size:14px;font-weight:600;cursor:pointer}

/* ---------- cards tab (stacked wallet) ---------- */

.card{aspect-ratio:1.586;border-radius:16px;padding:14px 16px;position:relative;border-top:.5px solid rgba(255,255,255,.2);transition:transform .15s}

.card .bt{position:absolute;left:16px;bottom:16px}
.chip{width:34px;height:26px;border-radius:5px;background:currentColor;opacity:.35;margin-bottom:12px}
.num{font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:.14em}
.card.lift{transition:none;z-index:5;outline:1.5px solid var(--g);scale:1.03}
.card.big{margin:0 auto 18px;max-width:360px}
#fab{position:fixed;right:max(16px,calc((100vw - 430px)/2 + 16px));bottom:calc(14px + env(safe-area-inset-bottom));z-index:46;width:70px;height:70px;border:0;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(120% 90% at 28% 8%,rgba(255,255,255,.34),rgba(255,255,255,0) 50%),rgba(0,205,8,.16);
  -webkit-backdrop-filter:blur(6px) saturate(170%) brightness(1.05);backdrop-filter:blur(6px) saturate(170%) brightness(1.05);filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));
  box-shadow:inset 0 12px 18px -14px rgba(255,255,255,.34),inset 0 -14px 20px -14px rgba(255,255,255,.14),inset 0 0 22px rgba(255,255,255,.06),0 14px 34px rgba(0,0,0,.38)}
#fab:active{transform:scale(.95)}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 16px 40px;visibility:hidden;opacity:0;transform:translateX(28px);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .22s,visibility 0s .3s}
.ov.on{visibility:visible;opacity:1;transform:none;transition-delay:0s}.ov>div{max-width:430px;margin:0 auto}
.sh{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;visibility:hidden;opacity:0;transition:opacity .22s,visibility 0s .3s}
.sh.on{visibility:visible;opacity:1;transition-delay:0s}.sh>div{transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);background:var(--p1);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));user-select:text;-webkit-user-select:text}.sh.on>div{transform:none}
.sh h2{margin:0 0 14px;font-size:18px;font-weight:500;color:var(--tx)}.sh p{font-size:13px;color:var(--sub);margin:0 0 12px;line-height:1.5}
.sh a{color:var(--g)}
.sh.cf{z-index:90;align-items:center;padding:16px}.sh.cf>div{max-width:320px;border-radius:20px;padding:20px;transform:translateY(16px)}.sh.cf.on>div{transform:none}
.sh.cf p{font-size:15px;color:var(--tx2);text-align:center;margin:0 0 18px}
.cfb{display:flex;gap:8px}.cfb .btn{margin-top:0}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.lk{background:none;border:0;color:var(--g);font-size:14px;font-weight:500;display:flex;align-items:center;gap:4px;padding:0;cursor:pointer;min-height:44px}.lk.m{color:var(--sub)}
.panel{background:var(--p1);border:.5px solid var(--line);border-radius:16px;padding:6px 16px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:.5px solid var(--line)}.row:last-child{border:0}
.ic{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:34px;height:34px;border-radius:11px;background:color-mix(in srgb,currentColor 16%,transparent)}
.rm{flex:1}.row .lab{margin-bottom:2px;font-size:12px;color:var(--mut);margin:2px 0 0}.row .val{font-size:15px;font-weight:600;color:var(--tx)}.row .val.L{font-size:20px}
.rr{font-size:13px;color:var(--tx3);text-align:right}.rr .s{font-size:11px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--sub);margin:0 0 5px}
input{height:46px}
textarea{resize:none;font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus,textarea:focus{outline:1px solid var(--g);border-color:var(--g)}
input[type=file]{height:auto;padding:9px;font-size:14px;color:var(--sub)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:600;font-size:15px;cursor:pointer;background:var(--g);color:#000;margin-top:4px;min-height:46px}
.btn.s{background:var(--p2);color:var(--tx2)}.btn.d{background:none;color:var(--org)}
.btn.d2{background:#2a1215;border:1px solid #7f1d1d;color:#fecaca}
.btn.mini{width:auto;padding:0 16px;margin:0;font-size:13px;height:46px;flex-shrink:0}
.cprow{display:flex;gap:8px;margin-bottom:12px}.cprow input{margin:0;flex:1}
.stat{min-height:1.2em;font-size:12px;margin:0 0 12px}
.stat.ok{color:var(--g)}.stat.bad{color:#f87171}
.card.big.ph{padding:0;aspect-ratio:auto;border-top:0;width:fit-content}.card.big.ph img{max-width:100%;max-height:230px;width:auto;display:block;border-radius:16px}.card.big.ph .nm{position:absolute;left:16px;top:14px}
.eye{position:absolute;right:12px;top:10px;background:none;border:0;color:inherit;padding:4px;display:flex;cursor:pointer;min-width:44px;min-height:44px;align-items:center;justify-content:center}
.rv{position:absolute;inset:0;border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}.rt{display:flex;justify-content:space-between;align-items:center}
.card.big.ph .rv .nm{position:static}.rn{font-size:17px;letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;gap:8px}.cp{background:none;border:0;color:inherit;opacity:.85;padding:4px;display:flex;cursor:pointer}.ex>div{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}.ex small{width:100%;display:block;font-size:10px;opacity:.7}.ex{display:flex;gap:28px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
#cap{font-size:12px;color:var(--mut);text-align:center;margin:-8px 0 14px}#cap:empty{display:none}
#cSum{background:var(--p1);border-radius:22px;border:1px solid var(--line);padding:2px 16px;margin-bottom:6px}#cSum:empty{display:none}
.sr{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:.5px solid var(--line)}.sr:last-child{border:0}.sr .ic{width:34px;height:34px;border-radius:11px}.sr b{display:block;font-size:14px;color:var(--tx);font-weight:500}.sr small{font-size:12px;color:var(--sub)}
#pin{z-index:70}.dots{display:flex;justify-content:center;gap:14px;margin:0 0 18px}.dots span{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--mut)}.dots span.f{background:var(--g);border-color:var(--g)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}.pad button{background:var(--p2);border:0;border-radius:12px;padding:12px 0;font-size:22px;color:var(--tx);cursor:pointer;min-height:48px}.pad .gh{background:none;font-size:14px;color:var(--sub)}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}input[type=date]::-webkit-datetime-edit{padding:0}.two>div{min-width:0}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.ov .panel{animation:up .38s .1s cubic-bezier(.2,.8,.2,1) both;border-radius:22px;border:1px solid var(--line);padding:2px 16px}.ov .card.big{animation:up .36s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;transition-delay:0s!important}}
/* ---------- bottom bar: Liquid Glass inspired ---------- */
#tabs{position:fixed;left:max(0px,calc((100vw - 430px)/2));width:min(100vw,430px);bottom:0;z-index:45;pointer-events:none;padding:0 0 calc(14px + env(safe-area-inset-bottom))}
#tabsIn{pointer-events:auto;touch-action:none;position:relative;margin:0 0 0 16px;width:calc(100% - 120px);padding:6px;border-radius:42px;transition:width .3s cubic-bezier(.3,.9,.3,1),scale .3s cubic-bezier(.3,.9,.3,1);background:var(--glass);-webkit-backdrop-filter:blur(6px) saturate(170%) brightness(1.05);backdrop-filter:blur(6px) saturate(170%) brightness(1.05);box-shadow:inset 0 1px 2px -1px rgba(255,255,255,.22),inset 0 -1px 2px -1px rgba(255,255,255,.1),inset 0 0 22px rgba(255,255,255,.035),0 12px 30px rgba(0,0,0,.3)}
/* light catching the glass edge: bright only at two corners, never a full outline */
#tabsIn::before,#fab::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:3;
  background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,0) 14%,rgba(255,255,255,0) 84%,rgba(255,255,255,.34));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
#tabs.home #tabsIn{width:calc(100% - 32px)}
#tabsIn.lift{scale:1.045}
.tbr{position:relative;z-index:1;display:flex;--hl:0px;--hr:0px;--ha:0;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(var(--hl) - 7px),rgba(0,0,0,calc(1 - var(--ha))) calc(var(--hl) + 7px),rgba(0,0,0,calc(1 - var(--ha))) calc(var(--hr) - 7px),#000 calc(var(--hr) + 7px));
  mask-image:linear-gradient(90deg,#000 calc(var(--hl) - 7px),rgba(0,0,0,calc(1 - var(--ha))) calc(var(--hl) + 7px),rgba(0,0,0,calc(1 - var(--ha))) calc(var(--hr) - 7px),#000 calc(var(--hr) + 7px))}
/* resting highlight: a glass capsule behind the selected tab */
.tbi{position:absolute;left:0;width:60px;pointer-events:none;z-index:0;will-change:transform,width;background:none;box-shadow:none;border-radius:0;overflow:visible;top:7px;height:36px}

/* pressed: a clear glass lens follows the finger and magnifies what is under it */
.tbl{position:absolute;left:0;top:0;height:60px;width:80px;border-radius:999px;pointer-events:none;z-index:2;overflow:hidden;opacity:0;will-change:transform,width;
  -webkit-backdrop-filter:brightness(1.12) saturate(140%);backdrop-filter:brightness(1.12) saturate(140%);
  box-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 9px 10px -6px rgba(0,0,0,.6),inset 0 -9px 10px -6px rgba(0,0,0,.6),
    inset 10px 0 12px -8px rgba(255,70,90,.6),inset 20px 0 16px -14px rgba(70,150,255,.55),
    inset -10px 0 12px -8px rgba(70,220,255,.6),inset -20px 0 16px -14px rgba(255,170,60,.55),0 6px 18px rgba(0,0,0,.35)}
.lc{position:absolute;left:0;top:0;display:flex;will-change:transform}
.tb,.lci{flex:1;min-width:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--tabtx)}

#pdetail{bottom:0;z-index:35;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.bsub{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}.sec{font-size:13px;color:var(--sub);font-weight:500;margin:18px 0 10px}

.hh{display:flex;justify-content:space-between;align-items:center;margin:12px 4px 8px}.hh .sec{margin:0;font-weight:600}
.mr{display:flex;align-items:center;padding:11px 0;border-bottom:.5px solid var(--line);cursor:pointer;min-height:44px}.mr:last-child{border:0}.mr svg{color:#6b7280}
select{width:100%;background:var(--bg);border:.5px solid var(--line);border-radius:12px;padding:12px;color:var(--tx);font-size:16px;margin-bottom:12px;height:46px;-webkit-appearance:none;appearance:none}
.drow{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:.5px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:12px;font-size:16px;color:var(--tx);min-height:46px}
.pl{flex:1;min-width:0}.pl b{display:block;font-size:14px;color:var(--tx);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl small{font-size:12px;color:var(--mut)}
.thb{width:132px;border-radius:10px;display:block;flex-shrink:0}
.pm1{font-size:12px;color:var(--mut);margin-bottom:2px}.pm2{font-size:28px;color:var(--tx);font-weight:500;letter-spacing:-.01em}.pm3{font-size:12px;color:var(--sub);margin-top:2px}.pm4{font-size:12px;color:var(--mut);margin-top:2px}
.cw{position:relative;background:var(--p1);border:.5px solid var(--line);border-radius:16px;padding:14px 0 12px 12px;margin-bottom:10px}
.cw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:28px;border-radius:16px 0 0 16px;background:linear-gradient(90deg,var(--p1),rgba(18,36,44,0));pointer-events:none;z-index:1}
.sc{overflow-x:auto;overflow-y:hidden;padding-right:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.sc::-webkit-scrollbar{display:none}
.cols{display:flex;width:max-content;align-items:flex-end;height:116px;justify-content:space-evenly;border-bottom:1px solid var(--line)}
.col{display:flex;flex-direction:column-reverse;align-items:center;cursor:pointer;width:60px;height:116px;border-radius:10px 10px 0 0}.col>div{flex-shrink:0;width:40px}.col.sel{background:var(--sel)}
.labs{display:flex;width:max-content;color:var(--mut);justify-content:space-evenly;padding-top:8px;font-size:12px}.labs span{text-align:center;white-space:nowrap;width:60px}.labs .on{color:var(--g);font-weight:500}
.ib{border:.5px solid var(--line);color:var(--sub);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;border-radius:12px;width:40px;height:40px;background:var(--p0);flex-shrink:0}.ib:active{transform:scale(.94)}
.ok{color:#00c805!important}
.mhist{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:.5px solid var(--line);font-size:14px}.mhist:last-child{border:0}.mhist small{font-size:12px;color:var(--mut)}.mhist .pos{color:#86efac}.mhist .neg{color:#fecaca}
.mhead{display:flex;align-items:center;justify-content:space-between;margin:20px 0 6px;padding-top:16px;border-top:.5px solid var(--line)}.mhead h4{margin:0;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}.mhead button{background:none;border:0;color:#f87171;font-size:12px;text-decoration:underline;cursor:pointer;min-height:44px}
.mrow2{display:flex;gap:8px;margin-bottom:6px}.mrow2 input{margin:0;flex:1;font-family:ui-monospace,Menlo,monospace}

/* ---------- Home: reorderable cards (first two large, the rest small) ---------- */
#hList{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#hList>*{margin:0}
#hList .n-card{margin:0}
#hList .hl{grid-column:1/-1}
#hList .wide{grid-column:1/-1}
#hList .n-tile{display:block;width:100%;min-height:62px}
#hList .n-tile b.amb{color:var(--amb)}
#hList .n-tile b.blu{color:var(--blue)}
.chev{color:var(--mut);display:flex}
.n-maa{border-color:rgba(20,83,45,.6)}
.n-link{background:none;border:0;padding:0 0 0 12px;min-height:44px;margin:-14px -4px -14px 0;font-size:12px;color:var(--g);cursor:pointer}
.n-maaC{display:flex;gap:8px}
.n-maaC input{flex:1;min-width:0;height:44px;margin:0;padding:0 12px;border-radius:12px;background:var(--p2);font-family:ui-monospace,Menlo,monospace}
.hm-brk{margin-top:14px;display:flex;flex-direction:column;gap:11px}.hm-brk:empty{display:none}
.hm-brk .r{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx3)}
.hm-brk .r i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.hm-brk .r span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-brk .r em{font-style:normal;color:var(--sub);font-size:12.5px;text-align:right;width:44px}
.hm-brk .r b{font-weight:500;color:var(--tx);min-width:78px;text-align:right}
#hPaidBar:empty,#hLimBar:empty{display:none}
#hPaidBV,#hLimBV{margin-bottom:14px}
.ed-sub{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.4}
.ed-list{display:flex;flex-direction:column;gap:8px;position:relative}
.ed-row{display:flex;align-items:center;gap:12px;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 14px;min-height:62px;color:var(--tx);font-size:15px;font-weight:500;transition:transform .16s,box-shadow .16s,background .16s}
.ed-row .n{width:22px;height:22px;border-radius:50%;background:var(--p2);color:var(--sub);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ed-row .nm{flex:1;min-width:0}
.ed-row .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--g);border:1px solid rgba(0,200,5,.4);border-radius:999px;padding:3px 8px}.ed-row .tag.s{color:var(--mut);border-color:var(--line)}
.ed-row .hd{width:48px;height:48px;border:0;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;border-radius:12px;padding:0}
.ed-row .hd:focus-visible{outline:2px solid var(--g)}
.ed-row.drag{transition:none;background:#183842;border-color:rgba(0,200,5,.55);box-shadow:0 18px 30px rgba(0,0,0,.55);position:relative;z-index:2}
.ed-div{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:4px 0}
.ed-div:before,.ed-div:after{content:"";flex:1;height:1px;background:var(--line)}
#hPaidBar i,#hLimBar i{min-width:4px}

/* ---------- generic card (no photo) ---------- */
.card.gen{background:var(--gen);color:#f1f5f9;border-top:.5px solid rgba(255,255,255,.25)}
.card.gen .chip{background:linear-gradient(135deg,#f0dfa8,#c2a24e);opacity:1}
.gen-bg{background:var(--gen)}
/* ---------- card photo ---------- */
.lb{font-size:12px;color:var(--sub);margin:14px 0 8px}
.upb{border:1px dashed rgba(255,255,255,.28);border-radius:14px;background:var(--p2);min-height:76px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--tx2);font-size:15px;font-weight:500;width:100%;cursor:pointer}
.up{display:flex;align-items:center;gap:12px;background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:12px}
.up img{width:74px;border-radius:8px;display:block}
.up .t{flex:1;min-width:0;font-size:14px;color:var(--tx2)}.up .t small{display:block;color:var(--mut);font-size:12px;margin-top:2px;line-height:1.35}
.ub{background:var(--p1);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer}
.rm2{background:none;border:0;color:#ff6b6b;font-size:13px;padding:9px 6px;cursor:pointer}
.hint{font-size:12px;color:var(--mut);margin:8px 2px 16px;line-height:1.4}
/* ---------- chart color ---------- */
.rowb{width:100%;background:none;border:0;border-bottom:.5px solid var(--line);text-align:left;color:inherit;cursor:pointer;padding:12px 0}.rowb:last-child{border:0}
.cc-sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.3);margin-left:auto;flex-shrink:0}
.cpk-sv{position:relative;height:210px;border-radius:14px;touch-action:none;margin-bottom:16px;cursor:crosshair}
.cpk-sv i{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 3px 8px rgba(0,0,0,.5);pointer-events:none}
.cpk-hue{position:relative;height:30px;border-radius:15px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);margin-bottom:18px;touch-action:none}
.cpk-hue i{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 3px 8px rgba(0,0,0,.5);pointer-events:none}
.cpk-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cpk-sw{width:46px;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.25);flex-shrink:0}
.cpk-hex{flex:1;min-width:0;height:46px;margin:0;font-family:ui-monospace,Menlo,monospace;font-size:16px;letter-spacing:.04em}
.cpk-prev{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.cpk-prev small{display:block;color:var(--mut);font-size:11px;margin-bottom:8px}
.cpk-btns{display:flex;gap:8px}.cpk-btns .btn{margin-top:0}
.n-then{font-size:12.5px;color:var(--sub);margin-top:12px;padding-top:10px;border-top:.5px solid var(--line);line-height:1.4}

/* ---------- debit cards and Zelle in ---------- */
.zseg{display:flex;gap:4px;padding:4px;background:var(--p2);border:.5px solid var(--line);border-radius:14px;margin:8px 0 6px}
.zseg[hidden],#crd[hidden],.zsub[hidden]{display:none}
.zseg button{flex:1;border:0;background:none;color:var(--sub);font-family:inherit;font-size:15px;font-weight:600;padding:11px 0;border-radius:11px;min-height:44px;cursor:pointer}
.zseg button.on{background:var(--segon);color:var(--tx);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.zseg button.zg2.on{background:rgba(61,255,69,.16);color:var(--hi);box-shadow:inset 0 0 0 1px rgba(61,255,69,.3)}
.zsub{font-size:12px;color:var(--sub);margin:8px 0 12px}
.zg,.mr .pl b.zg{color:var(--hi)}
.hm-brk .r.z i{opacity:0}.hm-brk .r.z span,.hm-brk .r.z b{color:var(--hi)}

/* ---------- iPhone only (Android keeps its own sizing): slightly tighter Home so every card fits above the tab bar ---------- */
@supports (-webkit-touch-callout:none){
  #vHome .top{margin-bottom:16px}
  #hList{gap:12px}
  #hList .n-card{padding:16px 18px}
  #hList .n-big{margin:4px 0 12px}#hList .n-big b{font-size:42px}
  #hList .hm-brk{margin-top:12px;gap:9px}
  #hList .n-then{margin-top:12px;padding-top:10px}
  #hList .n-tile{min-height:0;padding:14px 16px}
  /* Next up a touch more compact */
  #hNext .n-card{padding:14px 18px}
  #hNext .n-big{margin:2px 0 10px}
  #hNext .n-then{margin-top:10px;padding-top:8px}
}
/* iPhone: WhatsApp / App Store sized bar (60pt tall, 21pt side margins, 60pt plus button), 16px above the screen edge */
@supports (-webkit-touch-callout:none){
  #tabs{padding-bottom:19px}
  #tabsIn{margin-left:21px;width:calc(100% - 110px)}
  #tabs.home #tabsIn{width:calc(100% - 42px)}
  .tb,.lci{min-height:48px}
  #fab{width:60px;height:60px;right:21px;bottom:19px}
}

/* Selected tab: no capsule, a soft green glow behind its icon and label (centred on the tab row: 70px bar here, 60px on iPhone) */
.tbi::after{content:"";display:block;position:absolute;left:50%;right:auto;top:-3px;width:84px;height:62px;margin-left:-42px;border-radius:50%;background:radial-gradient(closest-side,rgba(61,255,69,.30),rgba(61,255,69,0))}
@supports (-webkit-touch-callout:none){ .tbi{top:2px} .tbi::after{top:-6px;height:58px} }

/* =====================================================================
   Redesign: big titles, summary cards, grouped list cards, quieter sheets
   ===================================================================== */
/* header: big title + avatar on every tab, centred on one line */
.vt{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--tx);line-height:1.15}
.vt2{padding:2px 2px 14px}
#hTop>div:first-child{display:block;flex:1;min-width:0;padding-right:12px}
#hDate{font-size:14px;font-weight:500;color:var(--sub);margin:3px 0 3px;line-height:1.2}
#hDay{font-size:26px;font-weight:700;color:var(--tx);letter-spacing:-.02em;margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-card{border-radius:22px}
.n-sum{margin-bottom:12px}
.n-sum .n-big{margin:4px 0 6px}
.n-sum .bsub{font-size:13px;display:block}
.n-sumtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.n-sg{display:flex;gap:3px;height:12px;margin-top:14px}.n-sum .n-sg{margin-top:12px}.n-sg i{display:block;height:100%;border-radius:4px;min-width:4px}.n-sg:empty{display:none}

/* grouped list card */
.lcard{background:var(--p1);border:1px solid var(--line);border-radius:22px;padding:0 16px;margin-bottom:12px}
#eList>.xr:last-child,#eList>.xs:last-child{border-bottom:0}
.n-mrow .xa{font-size:15px}
.n-maaC input,.mrow2 input{font-family:inherit}
.emp{text-align:center;padding:26px 12px 28px;border-top:1px solid var(--line)}
.emp:only-child,#eList:empty+.emp{border-top:0}
.emp .ei{width:46px;height:46px;border-radius:15px;background:var(--p0);color:var(--mut);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.emp b{display:block;font-size:16px;color:var(--tx);font-weight:600}.emp span{display:block;font-size:13px;color:var(--mut);margin-top:4px}

/* payments tab */
.n-sum .cw{background:none;border:0;border-radius:0;padding:14px 0 0;margin:0}
.n-sum .cw::before{display:none}
.n-sum .sc{padding-right:0}
.sc>.cols,.sc>.labs{min-width:100%}
.col>div+div{margin-bottom:-.5px}
.labs .on{color:var(--hi);font-weight:700}
#plist .pr{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;padding:12px 0;gap:12px}
#plist .pr:last-child{border-bottom:0}
.pr .pd{width:10px;height:10px;border-radius:3px;flex-shrink:0}
#plist .empty{padding:24px 0}
/* detail pages */
.ov .nav{margin-bottom:10px}
.pillb{background:var(--p2);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:38px;color:var(--tx);font-size:14px;font-weight:600;cursor:pointer}
.ov .panel .row{gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.ov .panel .row:last-child{border:0}
.rr .v{font-size:15px;font-weight:600;color:var(--tx)}.rr .s{font-size:12.5px;color:var(--sub);margin-top:2px}
.rowb .cc-sw{width:46px;height:26px;border-radius:9px;border:1px solid rgba(255,255,255,.22)}
.n-sum .thb{width:84px;border-radius:10px}
.pdm{flex:1;min-width:0}.pdm .pm2{font-size:32px;font-weight:600;letter-spacing:-.02em}.pdm .pm1,.pdm .pm3,.pdm .pm4{font-size:12px}
.lcard .mr{gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.lcard .mr:last-child{border:0}
.dt{width:34px;height:34px;border-radius:11px;background:var(--p0);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1}.dt b{font-size:14px;color:var(--tx);font-weight:600}.dt s{text-decoration:none;font-size:9px;color:var(--mut);margin-top:2px}
.lcard .mr .pl b{font-size:15px;font-weight:600}
.lcard .mr svg{color:var(--mut)}
#pdetail .sec{margin:6px 4px 8px;font-weight:600}
/* add / edit sheets: a little calmer */
#sheet>div{border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet>div::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--grab);margin:0 auto 14px}
#sheet h2{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0 0 16px}
#sheet label{font-size:13px;color:var(--mut);font-weight:500;margin:0 2px 6px}
#sheet input,#sheet select,#sheet textarea{background:var(--p0);border:1px solid var(--line);border-radius:16px}
#sheet input,#sheet select{height:52px;padding:0 16px;margin-bottom:14px}
#sheet textarea{padding:14px 16px;margin-bottom:14px}
#sheet input[type=file]{height:auto}
#sheet .fa{position:relative}
#sheet .fa span{position:absolute;left:16px;top:0;height:52px;display:flex;align-items:center;color:var(--mut);font-size:16px;pointer-events:none}
#sheet .fa input{padding-left:32px}
#sheet .fs{position:relative}
#sheet .fs i{position:absolute;left:16px;top:20px;width:11px;height:8px;border-radius:2px;pointer-events:none}
#sheet .fs select{padding-left:38px;padding-right:40px}
#sheet .fs::after{content:"";position:absolute;right:18px;top:19px;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);pointer-events:none}
#sheet .drow{height:52px;min-height:52px;border-radius:16px;background:var(--p0);border:1px solid var(--line);padding:0 16px;margin-bottom:14px}
#sheet .drow .lk{color:var(--hi);font-weight:600;font-size:15px}
#sheet .zseg{background:var(--p0);border:1px solid var(--line);border-radius:16px;margin:0 0 14px}
#sheet .zseg button{border-radius:12px;font-size:15px}
#sheet .zseg button.on{background:var(--p2);color:var(--tx);box-shadow:none}
#sheet .zseg button.zg2.on{background:rgba(61,255,69,.14);color:var(--hi);box-shadow:inset 0 0 0 1px rgba(61,255,69,.3)}
#sheet .zsub{color:var(--hi);font-size:12.5px;margin:-4px 2px 14px}
#sheet .btn{height:54px;min-height:54px;border-radius:16px;font-size:17px;font-weight:700;color:#04210a;margin-top:6px}
#sheet .btn.z{background:var(--hi)}
#sheet .btn.s{color:var(--tx2)}
#sheet .btn.cx{background:none;color:var(--sub);font-size:16px;font-weight:600;height:46px;min-height:46px;margin-top:2px}
#sheet .btn.d{color:var(--org);background:none;font-size:15px;font-weight:600;height:46px;min-height:46px}
#sheet .btn.d2{color:#fecaca}
#sheet .cfb .btn{font-size:15px;font-weight:600}
#sheet .btn.mini{height:52px}
#sheet .two label{min-height:34px;display:flex;align-items:flex-end}
#sheet .two input{margin-bottom:14px}
#sheet .upb{border-radius:16px;min-height:60px}
#sheet .cprow input{margin:0}
#sheet .mrow2 input{margin:0}
#sheet .sub-add input,#sheet .n-maaC input{height:44px}

/* ---------- avatar: first letter of your name, ring = sync status ---------- */
.av{position:relative;width:44px;height:44px;border-radius:50%;flex:none;border:0;padding:0;cursor:pointer;background:var(--g);color:var(--tx)}
.av::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg)}
.av b{position:absolute;inset:5px;border-radius:50%;background:var(--p2);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--tx)}
.av b svg{color:var(--mut)}
.av.w{background:conic-gradient(var(--amb) 0 68%,rgba(255,183,0,.18) 68% 100%)}
.av.e{background:var(--org)}
.av.big{width:76px;height:76px;cursor:default}.av.big::before{inset:4px;background:var(--p1)}.av.big b{inset:7px;font-size:30px}.av.big b svg{width:28px;height:28px}
.av:active:not(.big){transform:scale(.94)}
/* ---------- settings ---------- */
#settings{z-index:55}
.prof{display:flex;align-items:center;gap:16px;padding:16px 0}.pf{flex:1;min-width:0}
.pf label,#settings label{font-size:13px;color:var(--mut);font-weight:500;margin:0 2px 6px}
#settings input{background:var(--p0);border:1px solid var(--line);border-radius:16px;height:52px;padding:0 16px;margin-bottom:14px}
.pf input{margin:0}
#settings .hint{margin:-4px 4px 4px}
.panel.sp{margin-bottom:12px}
.row.rowb{width:100%}
.rr .v.sync-v{color:var(--hi)}.rr .v.sync-v.w{color:var(--amb)}.rr .v.sync-v.e{color:#ff7a3d}
.snote{font-size:13px;color:var(--sub);line-height:1.5;margin:0 4px 16px}.snote a{color:var(--hi)}
#settings .btn{height:54px;min-height:54px;border-radius:16px;font-size:17px;font-weight:700;color:#04210a;margin-top:6px}
#settings .btn.s{color:var(--tx2)}#settings .btn.mini{height:52px;font-size:14px;color:var(--tx2)}
#settings .btn.d{background:none;color:var(--org);font-size:15px;font-weight:600;height:46px;min-height:46px}
#settings .cprow input{margin:0}
#settings .ed-sub{margin:0 4px 16px}
/* grey bar on every bottom sheet, including the passcode pad */
#pin>div{border-radius:24px 24px 0 0;padding-top:10px}
#pin>div::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--grab);margin:0 auto 14px}
#sheet>div,#pin>div{overscroll-behavior:contain}

/* PIN page, data page, restore options */
.pinw{text-align:center;padding-top:8px}.pinw h2{margin:10px 0 6px;font-size:20px;font-weight:700;color:var(--tx)}
.pmsg{font-size:14px;color:var(--sub);margin:0 0 22px;min-height:20px;line-height:1.4}.pmsg.bad{color:var(--org)}
.pinw .pad{margin-top:4px}.pinw .btn{margin-top:6px}
.okc{width:64px;height:64px;border-radius:50%;margin:24px auto 14px;display:flex;align-items:center;justify-content:center;background:rgba(0,200,5,.15);color:var(--g)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin:0 0 8px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--p1);color:var(--tx);cursor:pointer;font:inherit}
.opt i{flex:none;width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.5px solid var(--mut)}
.opt.on{border-color:var(--g)}.opt.on i{border-color:var(--g);background:radial-gradient(circle,var(--g) 0 45%,transparent 50%)}
.opt b{display:block;font-size:15px;font-weight:600}.opt small{display:block;margin-top:3px;font-size:13px;color:var(--sub);line-height:1.35}
#settings .stat{margin:10px 2px 14px}

/* Next up: countdown ring in the card's chart color, details beside it */
.nr{display:flex;align-items:center;gap:16px}
.nr-ring{position:relative;width:92px;height:92px;flex:none}.nr-ring svg{display:block;transform:rotate(-90deg)}
.nr-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.nr-mid b{font-size:30px;font-weight:600;color:var(--tx);line-height:1}.nr-mid b.t{font-size:19px}.nr-mid span{font-size:12px;color:var(--sub);margin-top:2px}
.nr-txt{flex:1;min-width:0}
.nr-head{margin-bottom:12px}
.nr-ttl{font-size:17px;font-weight:600;color:var(--tx);line-height:1.2}
.nr-list{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.nr-list div{display:flex;align-items:center;gap:7px;min-width:0;font-size:14px;color:var(--tx3)}
.nr-list i{width:9px;height:9px;border-radius:3px;flex:none}
.nr-list s{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nr-list .n-tag{font-size:11px;font-weight:600;letter-spacing:0;flex:none}
#hNext .n-next .n-then{margin-top:12px;padding-top:9px}
.nr-then{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Expenses total: amount on the left, small wheel on the right, two-column legend below */
.es-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.es-top .n-big{margin:4px 0 0}
.n-donut.es-wheel{width:96px;height:96px}
.es-wheel .n-dc b{font-size:18px;font-weight:600;line-height:1}.es-wheel .n-dc small{font-size:9.5px;margin-top:2px}
.es-leg{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--r,1),auto);grid-template-columns:1fr 1fr;gap:8px 22px;margin-top:14px}
.es-leg div{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;color:var(--sub)}
.es-leg i{width:8px;height:8px;border-radius:50%;flex:none}
.es-leg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es-leg em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}

/* ---------- Display: Dim is the default above; Dark is true black; Light is a light theme ---------- */
:root[data-theme=dark]{--bg:#000;--p1:#0e0f11;--p2:#17181b;--line:#202226;--p0:#09090b;--p0b:#08080a;--grab:#2c2f34;--track:#1b1d21;--segon:#232529;--sel:rgba(255,255,255,.05)}
:root[data-theme=light]{color-scheme:light;--bg:#f2f4f6;--p1:#fff;--p2:#eef1f4;--line:#e3e7eb;--mut:#6b7280;--sub:#4b5563;--g:#14a83b;--amb:#b97400;--blue:#0a6fd1;--org:#d94a0a;
  --tx:#0f172a;--tx2:#1f2937;--tx3:#374151;--p0:#f4f6f8;--p0b:#f4f6f8;--grab:#c7cdd3;--hi:#0f9d35;--track:#e5e9ed;--tabtx:rgba(15,23,42,.88);--glass:rgba(255,255,255,.6);--sel:rgba(15,23,42,.05);--segon:#fff;--scrim:rgba(15,23,42,.35)}
:root[data-theme=light] .n-card,:root[data-theme=light] .n-tile,:root[data-theme=light] .lcard,:root[data-theme=light] .panel{box-shadow:0 1px 2px rgba(15,23,42,.05)}
:root[data-theme=light] .zseg button.on{box-shadow:0 1px 2px rgba(15,23,42,.12)}
:root[data-theme=light] .n-pm.m{background:#fdeeee;border-color:#f5c7c7;color:#b42318}
:root[data-theme=light] .n-pm.p{background:#e9f7ee;border-color:#b9e3c6;color:#127a32}
:root[data-theme=light] .upb{border-color:#c5ccd3}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root[data-theme=light] #tabsIn{background:rgba(255,255,255,.96)}:root[data-theme=dark] #tabsIn{background:rgba(23,24,27,.96)}}
@media (prefers-reduced-transparency:reduce){:root[data-theme=light] #tabsIn{background:rgba(255,255,255,.97)}:root[data-theme=dark] #tabsIn{background:rgba(23,24,27,.97)}}
:root[data-theme=light] #fab{background:radial-gradient(120% 90% at 28% 8%,rgba(255,255,255,.32),rgba(255,255,255,0) 50%),#16a34a;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 8px 20px rgba(22,163,74,.3)}
:root[data-theme=light] .tb,:root[data-theme=light] .lci{filter:none}

/* Customize Home: hide or show a card */
.ed-row .vis{width:40px;height:48px;border:0;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center;padding:0;border-radius:12px;cursor:pointer;flex-shrink:0}
.ed-row .vis:disabled{opacity:.3;cursor:default}.ed-row .vis:focus-visible{outline:2px solid var(--g)}
.ed-row.off .nm{color:var(--mut)}.ed-row.off .n{opacity:.4}
.ed-row .tag.h{color:var(--mut);border-color:var(--line)}

/* Payments: Month / Year switch and the twelve-month chart */
.pmode{display:flex;flex-shrink:0;background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.pmode button{border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--sub);padding:7px 12px;border-radius:8px;cursor:pointer;min-height:34px}
.pmode button.on{background:var(--segon);color:var(--tx)}
.pmode button:focus-visible,.yc:focus-visible,.ya:focus-visible{outline:2px solid var(--g)}
.y12{display:flex;align-items:flex-end;gap:5px;margin-top:14px}.y12[hidden]{display:none}
.yc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;font:inherit;cursor:pointer}
.yb{width:100%;height:120px;display:flex;flex-direction:column-reverse;border-radius:5px;overflow:hidden;background:var(--p2)}
.yb i{display:block;flex:none;width:100%}
.yc.f .yb{opacity:.35}.yc:disabled{cursor:default}
.yc small{font-size:11px;color:var(--mut)}.yc.has small{color:var(--tx2);font-weight:600}.yc.now small{color:var(--hi);font-weight:600}
.ya{border:0;background:none;color:var(--sub);font:inherit;font-size:17px;line-height:1;padding:0 8px;cursor:pointer;vertical-align:-1px}
.ya:first-child{padding-left:0}

/* card page on Payments: photo beside the name, Month / Year switch on the summary like the main screen */
.pdh{display:flex;align-items:center;gap:12px}.pdh .thb{width:56px;border-radius:8px;flex-shrink:0}.pdh .vt2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdm .pm2{white-space:nowrap}.pdm .pm4{margin-top:3px}
.pr .pv.zg,.pdm .pm2.zg{color:var(--hi)}

/* By card: the green Zelle in line under a debit card */
#plist .pr.pz{padding:0 0 12px;margin-top:-6px;min-height:0;border-bottom:1px solid var(--line)}
#plist .pr.pz .pd{visibility:hidden}#plist .pr.pz b{font-size:13px;font-weight:500}#plist .pr.pz .pv{font-size:14px;font-weight:500}
#plist .pr:has(+ .pr.pz){border-bottom:0}
#ptotal.zg{color:var(--hi)}
#plist .pr.pz b.zg{color:var(--hi)}

/* card page summary: label + switch on one line, then the paid amount, then Zelle in / After Zelle as two clear lines */
.pdtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.zrows{margin:8px 0 2px;border-top:1px solid var(--line)}
.zrows div{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--sub)}
.zrows b{font-size:15px;font-weight:600;color:var(--tx)}.zrows b.zg{color:var(--hi)}
</style>
</head>
<body>
<!-- ===================== HOME ===================== -->
<div id="vHome" class="view">
  <div class="top" id="hTop">
    <div><div class="dd" id="hDate"></div><div class="dn" id="hDay"></div></div>
    <button class="av hav" id="hAvatar" type="button" aria-label="Open settings"><b></b></button>
  </div>

  <div id="hList">
    <!-- large versions (the first two cards) -->

      <div class="n-row"><span class="lbl" style="margin:0">Total monthly expenses</span><span class="chev" id="chevHero"></span></div>
      <div class="n-big"><i>$</i><b id="hTotal">0.00</b></div>
      <div class="n-bar" id="hBar"></div>
      <div class="n-leg" id="hLeg"></div>
    </button>

    <div id="hNext" class="hl" data-k="next"></div>

    <div class="n-card still n-maa hl" data-k="maa">
      <div class="n-row"><span class="n-maaT"><i></i>Maaser</span><button class="n-link" type="button" id="hMaaBtn" aria-label="Open Maaser details">Open details</button></div>
      <div class="n-big"><b id="hMaa">$0.00</b></div>
      <div class="n-maaC">
        <input id="hAdj" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" aria-label="Adjust Maaser by">
        <button class="n-pm m" type="button" id="hSub" aria-label="Subtract from Maaser"></button>
        <button class="n-pm p" type="button" id="hAdd" aria-label="Add to Maaser"></button>
      </div>
    </div>

    <button class="n-card hl" type="button" data-k="paid" data-go="pay" id="hPaidBig">
      <div class="n-row"><span class="lbl" style="margin:0" id="hPaidLB">Paid so far</span><span class="chev"></span></div>
      <div class="n-big" id="hPaidBV"><b>&mdash;</b></div>
      <div class="n-bar" id="hPaidBar"></div>
      <div class="hm-brk" id="hPaidBrk"></div>
    </button>

    <button class="n-card hl" type="button" data-k="lim" data-go="cards" id="hLimBig">
      <div class="n-row"><span class="lbl" style="margin:0">Total credit limit</span><span class="chev"></span></div>
      <div class="n-big" id="hLimBV"><i>$</i><b>0</b></div>
      <div class="n-bar" id="hLimBar"></div>
      <div class="hm-brk" id="hLimBrk"></div>
    </button>

    <!-- small versions (every card after the first two) -->
    <button class="n-tile hs" type="button" data-k="exp" data-go="exp"><small>Monthly expenses</small><b id="sExp">$0.00</b></button>
    <button class="n-tile hs" type="button" data-k="next" data-go="cards"><small id="sNextL">Next up</small><b id="sNext">&mdash;</b></button>
    <button class="n-tile hs" type="button" data-k="maa" id="sMaaBtn"><small>Maaser</small><b id="sMaa">$0.00</b></button>
    <button class="n-tile hs" type="button" data-k="paid" data-go="pay"><small id="hPaidL">Paid this month</small><b id="hPaid">$0.00</b></button>
    <button class="n-tile hs" type="button" data-k="lim" data-go="cards"><small>Total credit limit</small><b id="hLimit">$0</b></button>
  </div>

</div>

<!-- ===================== EXPENSES ===================== -->
<div id="vExp" class="view" hidden>
  <div class="top"><h1 class="vt">Expenses</h1><button class="av hav" type="button" aria-label="Open settings"><b></b></button></div>
  <div class="n-card still n-sum">
    <div class="es-top">
      <div><div class="lbl" style="margin:0">Total monthly expenses</div><div class="n-big"><i>$</i><b id="eTotal">0.00</b></div></div>
      <div class="n-donut es-wheel" id="eDonut"></div>
    </div>

    <div id="eEmpty" class="emp" hidden><div class="ei"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10a1 1 0 0 1 1 1v15l-3-2-3 2-3-2-3 2V5a1 1 0 0 1 1-1z"/><path d="M9 9h6M9 13h4"/></svg></div><b>No expenses yet</b><span>Tap + to add your first expense.</span></div>

  <div class="top"><h1 class="vt">Cards</h1><button class="av hav" type="button" aria-label="Open settings"><b></b></button></div>
  <div class="n-card still n-sum">
    <div class="lbl" style="margin:0">Total credit limit</div>
    <div class="n-big"><i>$</i><b id="cTotal">0</b></div>

  <div class="top"><h1 class="vt">Payments</h1><button class="av hav" type="button" aria-label="Open settings"><b></b></button></div>
  <div class="n-card still n-sum">
    <div class="n-sumtop"><div><div class="lbl" id="ptl" style="margin:0">Paid this month</div><div class="n-big"><i>$</i><b id="ptotal">0.00</b></div><div class="bsub"><span id="pof"></span></div></div><div class="pmode" id="pmode" role="radiogroup" aria-label="Show"><button type="button" role="radio" data-v="month">Month</button><button type="button" role="radio" data-v="year">Year</button></div></div>
    <div class="cw" id="pchart"></div>

<script>
(function(){
'use strict';
/* =====================================================================
   CardWise: core helpers, data store, persistence
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
/* Display: Light, Dark or Dim (the default). Kept on this device only, like the iPhone's own setting. */
const THEMES = { light: '#f2f4f6', dark: '#000000', dim: '#0e1e24' };
function applyTheme(t) {
  t = THEMES[t] ? t : 'dim';
  document.documentElement.dataset.theme = t;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = THEMES[t];
  return t;
}
const themeNow = () => applyTheme(LS.get('et_theme'));
themeNow();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const nowTs = () => Date.now();
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const nf = n => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const mf = n => '$' + nf(n);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const svg = (p, s = 20) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC = {
  limit: '<circle cx="12" cy="12" r="9"/><path d="M12 12l4-4"/>',
  stmt: '<path d="M14 3v4h4M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2zM9 13h6M9 17h6"/>',
  due: '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/><circle cx="12" cy="16" r="1.5"/>',
  open: '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16M9 16l2 2 4-4"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff: '<path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.4 5.5A9.8 9.8 0 0112 5c4.5 0 8 4 9 7a13 13 0 01-2.5 3.7M6.5 6.5C4.5 8 3 10 3 12c1 3 4.5 7 9 7 1.6 0 3-.5 4.2-1.2"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
  check: '<path d="M5 12l5 5L20 7"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  home: '<path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/>',
  pie: '<circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/>',
  tcard: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h2"/>',
  cash: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
  cal: '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  edit: '<path d="M4 20h4L18.5 9.5a2.8 2.8 0 00-4-4L4 16v4zM13.5 6.5l4 4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  x: '<path d="M6 18L18 6M6 6l12 12"/>',
  grip: '<path d="M5 8h14M5 12h14M5 16h14"/>',
  bars: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'
};

/* ---------- dates ---------- */
const DAY = 864e5;
const today = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
const clampDay = (y, m, day) => new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));
/* next date (today counts) with this day-of-month */
function nxt(day) {
  const t = today();
  for (let o = 0; o < 3; o++) { const d = clampDay(t.getFullYear(), t.getMonth() + o, day); if (d >= t) return d; }
}
/* most recent date with this day-of-month; strict = must be before today */
function prevDate(day, strict) {
  const t = today();
  for (let o = 0; o < 3; o++) {
    const d = clampDay(t.getFullYear(), t.getMonth() - o, day);
    if (strict ? d < t : d <= t) return d;
  }
}
const daysUntil = d => Math.round((d - today()) / DAY);
const inDays = d => { const n = daysUntil(d); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'; };
const short = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const ord = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
function pd(s) { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c); }
function age(s) {
  const o = pd(s), n = new Date();
  const m = (n.getFullYear() - o.getFullYear()) * 12 + n.getMonth() - o.getMonth() - (n.getDate() < o.getDate() ? 1 : 0);
  if (m < 1) return 'New';
  const y = Math.floor(m / 12);
  return (y ? y + ' yr ' : '') + (m % 12) + ' mo';
}
const tstr = d => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

const KEY = 'et_data_v1';
/* Home cards, in their default order. The first two are shown large, the rest small. */
const HOME_KEYS = ['exp', 'next', 'maa', 'paid', 'lim'];
function homeOrder(o) {
  const out = [];
  (Array.isArray(o) ? o : []).forEach(k => { if (HOME_KEYS.indexOf(k) >= 0 && out.indexOf(k) < 0) out.push(k); });
  HOME_KEYS.forEach(k => { if (out.indexOf(k) < 0) out.push(k); });
  return out;
}
/* Home cards the person has hidden; at least one card always stays visible */
function homeHidden(h) {
  const out = [];
  (Array.isArray(h) ? h : []).forEach(k => { if (HOME_KEYS.indexOf(k) >= 0 && out.indexOf(k) < 0) out.push(k); });
  return out.length >= HOME_KEYS.length ? out.slice(0, HOME_KEYS.length - 1) : out;
}
const homeFrom = h => ({ order: homeOrder(h && h.order), hidden: homeHidden(h && h.hidden), updatedAt: (h && +h.updatedAt) || 0 });
const EMPTY = () => ({
  expenses: [],
  maaser: { amount: 0, history: [], updatedAt: 0 },
  home: { order: HOME_KEYS.slice(), hidden: [], updatedAt: 0 },
  profile: { name: '', updatedAt: 0 },
  security: { pin: '', updatedAt: 0 },
  cards: [],
  payments: [],
  deleted: { expenses: {}, cards: {}, payments: {} },
  dirty: { expenses: false, cards: false, payments: false }
});
let S = EMPTY();
const isDebit = c => !!c && c.type === 'debit';
function sortCards() { S.cards.sort((a, b) => ((a.pos || 0) - (b.pos || 0)) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)); }
function loadState() {
  try {
    const j = JSON.parse(LS.get(KEY) || 'null');
    if (j && typeof j === 'object') {
      S = Object.assign(EMPTY(), j);
      /* fill in anything missing so a partial record can never crash a later edit */
      ['expenses', 'cards', 'payments'].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });
      S.deleted = Object.assign(EMPTY().deleted, j.deleted || {});
      S.dirty = Object.assign(EMPTY().dirty, j.dirty || {});
      S.maaser = Object.assign(EMPTY().maaser, j.maaser || {});
      ['expenses', 'cards', 'payments'].forEach(k => { if (!S.deleted[k] || typeof S.deleted[k] !== 'object') S.deleted[k] = {}; });
      if (!Array.isArray(S.maaser.history)) S.maaser.history = [];
      S.home = homeFrom(j.home);
      S.profile = { name: String((j.profile && j.profile.name) || '').slice(0, 30), updatedAt: (j.profile && +j.profile.updatedAt) || 0 };
      S.security = { pin: String((j.security && j.security.pin) || '').slice(0, 40), updatedAt: (j.security && +j.security.updatedAt) || 0 };
    }

}

/* render hook is filled in by main.js */
const hooks = { render() {} };
/* kind: 'expenses' (includes Maaser) | 'cards' | 'payments' */
function commit(kind) {
  S.dirty[kind] = true;
  saveState();
  hooks.render();
  Sync.schedule();
}
function removeItem(kind, id) {
  S[kind] = S[kind].filter(x => x.id !== id);

/* =====================================================================
   Sync: one private gist, three files, per-item merge by timestamp
   ===================================================================== */
const GH = 'https://api.github.com';
const FILES = { expenses: 'expenses.json', cards: 'cards.json', payments: 'payments.json' };
const TOMB_TTL = 90 * DAY;

/* stable stringify (sorted keys) so equal data always compares equal */
function canon(v) {
  if (v === undefined) return 'null';
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
}

/* union by id, newest updatedAt wins, deletions are remembered as tombstones */
function mergeList(local, remote, tLocal, tRemote) {
  const tombs = Object.assign({}, tRemote || {});
  Object.keys(tLocal || {}).forEach(id => { tombs[id] = Math.max(tombs[id] || 0, tLocal[id]); });
  const t = nowTs();
  Object.keys(tombs).forEach(id => { if (t - tombs[id] > TOMB_TTL) delete tombs[id]; });
  const map = {};
  (remote || []).forEach(it => { if (it && it.id) map[it.id] = it; });
  (local || []).forEach(it => { if (it && it.id && (!map[it.id] || (it.updatedAt || 0) > (map[it.id].updatedAt || 0))) map[it.id] = it; });
  const items = Object.keys(map).map(id => map[id]).filter(it => !(tombs[it.id] && tombs[it.id] >= (it.updatedAt || 0)));
  items.sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  return { items, tombs };
}

const Sync = {
  etag: null, busy: false, again: false, timer: null, lastRemote: null,
  token() { return LS.get('et_token') || ''; },
  gist() { return LS.get('et_gist') || ''; },
  connected() { return !!(this.token() && this.gist()); },

  cur: { text: 'Not connected', cls: 'e' }, lastOk: 0,
  status(text, cls) {
    this.cur = { text, cls: cls || '' };
    if (text === 'Synced') this.lastOk = Date.now();
    $$('.syncT').forEach(x => { x.textContent = text; });
    $$('.sync-v').forEach(x => { x.classList.remove('w', 'e'); if (cls) x.classList.add(cls); });
    $$('.av').forEach(x => { x.classList.remove('w', 'e'); if (cls) x.classList.add(cls); });
    paintAvatars(); refreshSetSub();
  },
  headers() {
    return { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + this.token(), 'Content-Type': 'application/json' };
  },

  serialize(kind) {
    if (kind === 'expenses') return { version: 1, expenses: S.expenses, maaser: S.maaser, home: S.home, profile: S.profile, security: S.security, deleted: S.deleted.expenses };
    if (kind === 'cards') return { version: 1, cards: S.cards, deleted: S.deleted.cards };
    return { version: 2, payments: S.payments, deleted: S.deleted.payments };
  },

  /* merge what is in the gist into local data; returns true if anything visible changed */
  mergeIn(remote) {
    const before = canon({ e: S.expenses, m: S.maaser, h: S.home, n: S.profile, s: S.security, c: S.cards, p: S.payments });
    const rx = remote.expenses || {}, rc = remote.cards || {}, rp = remote.payments || {};
    const e = mergeList(S.expenses, rx.expenses, S.deleted.expenses, rx.deleted);
    S.expenses = e.items; S.deleted.expenses = e.tombs;
    if (rx.maaser && typeof rx.maaser === 'object' && (rx.maaser.updatedAt || 0) > (S.maaser.updatedAt || 0)) {
      S.maaser = Object.assign({ amount: 0, history: [], updatedAt: 0 }, rx.maaser);
    }
    if (rx.home && typeof rx.home === 'object' && (+rx.home.updatedAt || 0) > (S.home.updatedAt || 0)) {
      S.home = homeFrom(rx.home);
    }
    if (rx.profile && typeof rx.profile === 'object' && (+rx.profile.updatedAt || 0) > (S.profile.updatedAt || 0)) {
      S.profile = { name: String(rx.profile.name || '').slice(0, 30), updatedAt: +rx.profile.updatedAt };
    }
    if (rx.security && typeof rx.security === 'object' && typeof rx.security.pin === 'string' && (+rx.security.updatedAt || 0) > (S.security.updatedAt || 0)) {
      S.security = { pin: rx.security.pin.slice(0, 40), updatedAt: +rx.security.updatedAt };
    }
    const c = mergeList(S.cards, rc.cards, S.deleted.cards, rc.deleted);
    S.cards = c.items; S.deleted.cards = c.tombs; sortCards();
    const p = mergeList(S.payments, rp.payments, S.deleted.payments, rp.deleted);
    S.payments = p.items; S.deleted.payments = p.tombs;
    return before !== canon({ e: S.expenses, m: S.maaser, h: S.home, n: S.profile, s: S.security, c: S.cards, p: S.payments });
  },

  async parseFiles(j) {
    const out = {};
    for (const k of Object.keys(FILES)) {
      const f = j.files && j.files[FILES[k]];
      if (!f) continue;
      let txt = f.content;
      if (f.truncated) txt = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
      try { out[k] = JSON.parse(txt || 'null') || undefined; }
      catch (e) { throw new Error('data-corrupt'); }
    }
    return out;
  },

  async createGist(token) {
    const files = {};
    Object.keys(FILES).forEach(k => { files[FILES[k]] = { content: JSON.stringify(this.serialize(k)) }; });
    const res = await fetch(GH + '/gists', {
      method: 'POST',
      headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: 'CardWise data (private). Do not delete.', public: false, files })
    });
    if (res.status === 401) throw new Error('GitHub rejected that token.');
    if (res.status === 403 || res.status === 404) throw new Error('The token needs the gist permission.');
    if (!res.ok) throw new Error('GitHub error ' + res.status + '.');
    return (await res.json()).id;
  },

  /* returns 'ok' or a short message describing what went wrong */
  async run() {
    if (!this.connected()) { this.status('Not connected', 'e'); return 'Not connected'; }
    if (this.busy) { this.again = true; return 'busy'; }
    this.busy = true;
    this.status('Syncing', 'w');
    let result = 'ok';
    try {
      const h = this.headers();
      if (this.etag) h['If-None-Match'] = this.etag;
      const r = await fetch(GH + '/gists/' + this.gist(), { headers: h, cache: 'no-store' });
      if (r.status === 401) { this.status('Token expired', 'e'); return (result = 'GitHub rejected that token.'); }
      if (r.status === 404) { this.status('Gist not found', 'e'); return (result = 'No gist with that ID was found for this token.'); }
      if (r.status === 403 || r.status === 429) { this.status('Rate limited', 'e'); return (result = 'GitHub is limiting requests. Try again in a few minutes.'); }
      let remote = this.lastRemote || {};
      if (r.status === 200) {
        this.etag = r.headers.get('ETag') || null;
        remote = await this.parseFiles(await r.json());
        this.lastRemote = remote;
        const changed = this.mergeIn(remote);
        saveState();
        if (changed) hooks.render(true);
      } else if (r.status !== 304) {
        throw new Error('HTTP ' + r.status);
      }
      /* push whatever the gist does not already have */
      const files = {}, pushed = {};
      Object.keys(FILES).forEach(k => {
        const mine = this.serialize(k);
        if (S.dirty[k] || canon(mine) !== canon(remote[k])) { files[FILES[k]] = { content: JSON.stringify(mine) }; pushed[k] = mine; }
      });
      if (Object.keys(files).length) {
        const pr = await fetch(GH + '/gists/' + this.gist(), { method: 'PATCH', headers: this.headers(), body: JSON.stringify({ files }) });
        if (pr.status === 401) { this.status('Token expired', 'e'); return (result = 'GitHub rejected that token.'); }
        if (!pr.ok) throw new Error('HTTP ' + pr.status);
        this.etag = pr.headers.get('ETag') || null;
        Object.keys(pushed).forEach(k => { remote[k] = pushed[k]; S.dirty[k] = false; });
        this.lastRemote = remote;
        saveState();
      }
      this.status('Synced', '');
    } catch (e) {
      if (e && e.message === 'data-corrupt') { this.status('Data error', 'e'); result = 'The gist data could not be read, so nothing was changed.'; }
      else { this.status(navigator.onLine === false ? 'Offline' : 'Not saved', 'e'); result = 'Could not reach GitHub.'; }
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; setTimeout(() => this.run(), 50); }
    }
    return result;
  },

  schedule() {
    clearTimeout(this.timer);
    if (!this.connected()) { this.status('Not connected', 'e'); return; }
    this.timer = setTimeout(() => this.run(), 400);
  },

  async connect(token, gistId) {
    if (!gistId) gistId = await this.createGist(token);
    LS.set('et_token', token); LS.set('et_gist', gistId);
    this.etag = null; this.lastRemote = null;
    const r = await this.run();
    if (r !== 'ok') throw new Error(r);
  },

  disconnect() {
    LS.del('et_token'); LS.del('et_gist');
    this.etag = null; this.lastRemote = null;
    this.status('Not connected', 'e');
  }
};

function confirmDlg(message, okText) {

      resolve(r);
    };
    $('#cfo').onclick = () => finish(true);

/* Drag a bottom sheet down by its grey bar (or title) to close it. Past halfway, or a quick flick, closes; otherwise it springs back. */
function swipeClose(sheet, close) {
  const panel = sheet.firstElementChild, ZONE = 64;
  let D = null;
  const begin = (y, id) => {
    const r = panel.getBoundingClientRect();
    if (D || y - r.top > ZONE || y < r.top || panel.scrollTop > 0) return false;
    D = { id, y0: y, t0: performance.now(), dy: 0, h: r.height };
    panel.style.transition = 'none'; sheet.style.transition = 'none';
    return true;
  };
  const move = y => {
    D.dy = Math.max(0, y - D.y0);
    panel.style.transform = 'translateY(' + D.dy + 'px)';
    sheet.style.background = 'rgba(0,0,0,' + (0.6 * (1 - Math.min(1, D.dy / D.h))).toFixed(3) + ')';
  };
  const finish = cancel => {
    if (!D) return;
    const d = D; D = null;
    const fast = d.dy > 40 && d.dy / Math.max(1, performance.now() - d.t0) > 0.6;
    panel.style.transition = ''; sheet.style.transition = '';
    panel.style.transform = ''; sheet.style.background = '';
    if (!cancel && (d.dy > d.h * 0.4 || fast)) close();
  };
  panel.addEventListener('pointerdown', e => {
    if (e.button > 0 || !begin(e.clientY, e.pointerId)) return;
    try { panel.setPointerCapture(e.pointerId); } catch (_) {}
  });
  panel.addEventListener('pointermove', e => { if (D && e.pointerId === D.id) move(e.clientY); });
  panel.addEventListener('pointerup', e => { if (D && e.pointerId === D.id) finish(false); });
  panel.addEventListener('pointercancel', e => { if (D && e.pointerId === D.id) finish(true); });
  /* stop the page from scrolling while the sheet is being dragged */
  panel.addEventListener('touchmove', e => { if (D) e.preventDefault(); }, { passive: false });
}

/* =====================================================================
   Home: expense total, Next up countdown, compact Maaser, tiles
   ===================================================================== */
const weekdayDate = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

/* The soonest event: a payment due or a statement closing. If both fall on the same day the payment leads and the
   statement rides along in the same ring. Also finds the event after it, for the "Then" line. */
function nextUpInfo() {
  const ev = [];
  S.cards.forEach(c => {
    if (+c.dueDay > 0) ev.push({ k: 'p', d: nxt(+c.dueDay), c });
    if (+c.stmtDay > 0) ev.push({ k: 's', d: nxt(+c.stmtDay), c });
  });
  if (!ev.length) return null;
  ev.sort((a, b) => (+a.d - +b.d) || (a.k === b.k ? 0 : a.k === 'p' ? -1 : 1));
  const first = ev[0], date = first.d, days = daysUntil(date), kind = first.k;
  const group = ev.filter(e => e.k === kind && +e.d === +date).map(e => e.c);
  const other = ev.filter(e => e.k !== kind && +e.d === +date).map(e => e.c);
  let stmt = null, frac = null;
  if (kind === 'p') {
    let prevDue = null;
    group.forEach(c => {
      if (+c.stmtDay > 0) { const s = prevDate(+c.stmtDay, false); if (s && (!stmt || s > stmt)) stmt = s; }
      const p = prevDate(+c.dueDay, true); if (p && (!prevDue || p > prevDue)) prevDue = p;
    });
    /* only fill the ring when a statement has closed since the last due date */
    if (stmt && date > stmt && (!prevDue || stmt >= prevDue)) frac = Math.max(0, Math.min(1, (today() - stmt) / (date - stmt)));
    else stmt = null;
  } else {
    /* the ring fills from the previous statement close to this one */
    group.forEach(c => { const s = prevDate(+c.stmtDay, true); if (s && (!stmt || s > stmt)) stmt = s; });
    if (stmt && date > stmt) frac = Math.max(0, Math.min(1, (today() - stmt) / (date - stmt)));
    else stmt = null;
  }
  /* the next day with something happening after this one */
  const rest = ev.filter(e => +e.d > +date);
  let then = null;
  if (rest.length) {
    const m2 = +rest[0].d, at = rest.filter(e => +e.d === m2);
    then = { d: new Date(m2), p: at.filter(e => e.k === 'p').map(e => e.c), s: at.filter(e => e.k === 's').map(e => e.c) };
  }
  return { kind, group, other, date, days, stmt, frac, then };
}

function renderNextUp() {
  const host = $('#hNext');
  const info = nextUpInfo();
  if (!info) {
    host.innerHTML = `<button class="n-card n-next" type="button" data-go="cards">
      <div class="n-row"><span class="lbl" style="margin:0">Next up</span></div>
      <div class="n-none">${S.cards.length ? 'Add a payment due day or statement day to a card to see a countdown here.' : 'Add a card to see when your next payment is due.'}</div></button>`;
    return;
  }
  const { kind, group, other, date, days, frac, then } = info;
  const many = group.length > 1, st = kind === 's', both = other.length > 0;
  /* title: "Payment due", "Statements close", or "Payment & statement" when both fall on the same day */
  const title = both ? `${many ? 'Payments' : 'Payment'} &amp; ${other.length > 1 ? 'statements' : 'statement'}`
    : st ? (many ? 'Statements close' : 'Statement closes') : (many ? 'Payments due' : 'Payment due');
  /* ring: one section per card in its chart color; it fills from the last statement to the date */
  const ringCards = group.concat(other.filter(c => !group.includes(c)));
  const R = 40, C = 2 * Math.PI * R, n = ringCards.length, gap = n > 1 ? 5 : 0;
  const fill = days === 0 || frac == null ? 1 : Math.max(frac, 0.02), faint = days !== 0 && frac == null;
  let arcs = '', off = 0;
  ringCards.forEach(c => {
    const seg = C * fill / n, L = Math.max(seg - gap, 1);
    arcs += `<circle cx="46" cy="46" r="${R}" fill="none" stroke="${esc(cCol(c.id))}" stroke-width="9" stroke-linecap="${n > 1 ? 'butt' : 'round'}" stroke-dasharray="${L.toFixed(1)} 999" stroke-dashoffset="${(-off).toFixed(1)}"${faint ? ' opacity=".4"' : ''}/>`;
    off += seg;
  });
  const mid = days === 0 ? '<b class="t">Today</b>' : `<b>${days}</b><span>${days === 1 ? 'day' : 'days'}</span>`;
  const row = (c, tag) => `<div><i style="background:${esc(cCol(c.id))}"></i><s>${esc(lbl(c))}</s>${tag ? `<em class="n-tag ${tag === 'Payment' ? 'p' : 's'}">${tag}</em>` : ''}</div>`;
  const list = both ? group.map(c => row(c, 'Payment')).join('') + other.map(c => row(c, 'Statement')).join('') : group.map(c => row(c)).join('');
  /* "Then Nov 10 \u00b7 Chase, Amex statements close": short card names, one line */
  let thenTxt = '';
  if (then) {
    const parts = [];
    if (then.p.length) parts.push(`${shortNames(then.p)} ${then.p.length > 1 ? 'payments due' : 'payment due'}`);
    if (then.s.length) parts.push(`${shortNames(then.s)} ${then.s.length > 1 ? 'statements close' : 'statement closes'}`);
    thenTxt = `<div class="n-then nr-then">Then ${esc(short(then.d))} \u00b7 ${parts.join(' \u00b7 ')}</div>`;
  }
  const names = a => a.map(c => esc(lbl(c))).join(', ');
  const what = both ? 'payment due and statement closes' : st ? 'statement closes' : 'payment due';
  const when = days === 0 ? 'today' : `in ${days} ${days === 1 ? 'day' : 'days'}`;
  host.innerHTML = `<button class="n-card n-next${st ? ' st' : ''}${days <= 3 ? ' urgent' : ''}" type="button" data-go="cards" aria-label="Next ${what} ${when}, ${esc(weekdayDate(date))}: ${names(both ? group.concat(other) : group)}. Open Cards">
    <div class="n-row nr-head"><span class="lbl" style="margin:0">Next up</span><span class="n-date">${esc(weekdayDate(date))}</span></div>
    <div class="nr">
      <div class="nr-ring" aria-hidden="true"><svg width="92" height="92" viewBox="0 0 92 92"><circle cx="46" cy="46" r="${R}" fill="none" style="stroke:var(--track)" stroke-width="9"/>${arcs}</svg><div class="nr-mid">${mid}</div></div>
      <div class="nr-txt"><div class="nr-ttl">${title}</div><div class="nr-list">${list}</div></div>
    </div>
    ${thenTxt}</button>`;
}

/* first word of a card's name ("Chase" for Chase Freedom Unlimited), unless another card starts with the same word */
function shortNames(cards) {
  const first = c => lbl(c).split(/\s+/)[0];
  return cards.map(c => {
    const f = first(c), clash = S.cards.some(o => o.id !== c.id && first(o).toLowerCase() === f.toLowerCase());
    return esc(clash || lbl(c).split(/\s+/).length < 2 ? lbl(c) : f);
  }).join(', ');
}

/* "Good evening, Alex": by the hour on this phone; the date sits above it. Midnight to 5am is "Late check-in". */
const greetWord = h => h < 5 ? 'Late check-in' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
function paintGreeting() {
  const d = new Date(), n = firstName(), el = $('#hDay'), g = greetWord(d.getHours());
  $('#hDate').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  el.textContent = n ? g + ', ' + n : g;
  let s = 26; el.style.fontSize = s + 'px';
  /* a long name shrinks the line a little so it never gets cut off */
  if (el.clientWidth > 0) while (el.scrollWidth > el.clientWidth + 1 && s > 17) { s--; el.style.fontSize = s + 'px'; }
}

function renderHome() {

  const act = activeExp(), tot = totalExp();

  if (!act.length) {
    $('#hBar').innerHTML = '';
